0446\u0438\u0438 \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442\u0430: \u0418\u0424\u0410,\u0420\u0421\u041a,\u0420\u041d,\u0420\u0422\u0413\u0410, \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043f\u0440\u0435\u0446\u0438\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438","\u043d\u0430\u0442\u0443\u0440\u0430\u043b\u044c\u043d\u0430\u044f \u043e\u0441\u043f\u0430","\u043a\u0430\u0440\u0431\u043e\u043b\u043e\u0432\u044b\u0439 \u0444\u0443\u043a\u0441\u0438\u043d, \u043c\u0435\u0442\u0438\u043b\u0435\u043d\u043e\u0432\u044b\u0439 \u0441\u0438\u043d\u0438\u0439, \u0441\u0435\u0440\u043d\u0430\u044f \u043a\u0438\u0441\u043b\u043e\u0442\u0430"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u0443\u044e \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442, \u043f\u0440\u043e\u043d\u0438\u043a\u0448\u0430\u044f \u0432 \u043a\u043b\u0435\u0442\u043a\u0443 \u0432\u0438\u0440\u0443\u0441\u043d\u0430\u044f \u043d\u0443\u043a\u043b\u0435\u0438\u043d\u043e\u0432\u0430\u044f \u043a\u0438\u0441\u043b\u043e\u0442\u0430?","\u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442 \u043d\u0430\u0441\u043b\u0435\u0434\u0441\u0442\u0432\u0435\u043d\u043d\u0443\u044e (\u0433\u0435\u043d\u043e\u043c\u043d\u0443\u044e) \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0438 \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u043c\u0430\u0442\u0440\u0438\u0447\u043d\u043e\u0439, \u0438\u043b\u0438 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u043e\u043d\u043d\u043e\u0439 \u0420\u041d\u041a","\u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435 \u0441\u043a\u0438\u0435 \u043f\u043e\u0440\u0430\u0436\u0435\u043d\u0438\u044f \u043e\u0431\u043e\u043b\u043e\u0447\u0435\u043a \u0438 \u0442\u0435\u043b\u0430 \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430 (\u043e\u0441\u043f\u0438\u043d\u044b, \u043a\u0440\u043e\u0432\u043e\u0438\u0437\u043b\u0438\u044f\u043d\u0438\u044f); \u0433\u0438\u0431\u0435\u043b\u044c \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430; \u043f\u043e\u043b\u043e\u0436\u0438\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0420\u0413\u0410 \u0441 \u0432\u0438\u0440\u0443\u0441\u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0449\u0435\u0439 \u0436\u0438\u0434\u043a\u043e\u0441\u0442\u044c\u044e, \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u043d\u043e\u0439 \u0438\u0437 \u043f\u043e\u043b\u043e\u0441\u0442\u0435\u0439 \u0437\u0430\u0440\u0430\u0436\u0435\u043d\u043d\u043e\u0433\u043e \u0437\u0430\u0440\u043e\u0434\u044b\u0448\u0430.","\u043e\u0431\u043b\u0438\u0433\u0430\u0442\u043d\u044b\u0435 (\u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435) \u0432\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u0435 \u043f\u0430 \u0440\u0430\u0437\u0438\u0442\u044b","\u043f\u0438\u0442\u0430\u044e\u0442\u0441\u044f \u043c\u0435\u0440\u0442\u0432\u044b\u043c \u043e\u0440\u0433\u0430\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b\u043e\u043c"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a \u043d\u0430\u0437\u044b\u0432\u0430\u044e\u0442\u0441\u044f \u043c\u0438\u043a\u0440\u043e\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u044b, \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u044e\u0449\u0438\u0435 \u0441\u0432\u0435\u0442 \u0432 \u043a\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u0430 \u044d\u043d\u0435\u0440\u0433\u0438\u0438 \u0438 \u043d\u0435\u043e\u0440\u0433\u0430\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0432\u0435\u0449\u0435\u0441\u0442\u0432\u0430, \u043a\u0430\u043a \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a \u0443\u0433\u043b\u0435\u0440\u043e\u0434\u0430?","\u0444\u043e\u0442\u043e\u0430\u0432\u0442\u043e\u0442\u0440\u043e\u0444\u044b","Reoviridae, \u0421aliciviridae, Astroviridae, Picornaviridae","\u0434\u043b\u044f \u0447\u0438\u0441\u0442\u044b\u0445 \u043a\u0443\u043b\u044c\u0442\u0443\u0440 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439","\u0441\u043f\u0438\u0440\u0430\u043b\u044c\u043d\u043e\u043c\u0443, \u0438\u043a\u043e\u0441\u0430\u044d\u0434\u0440\u0438\u0447\u0435\u0441\u043a\u043e\u043c\u0443 \u0438 \u0441\u043b\u043e\u0436\u043d\u043e\u043c\u0443"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u0447\u0442\u043e \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u043e \u0434\u043b\u044f \u043c\u0438\u043a\u0440\u043e\u0431\u043e\u0432 \u2013 \u0441\u0430\u043f\u0440\u043e\u0444\u0438\u0442\u043e\u0432?","\u043f\u0438\u0442\u0430\u044e\u0442\u0441\u044f \u043c\u0435\u0440\u0442\u0432\u044b\u043c \u043e\u0440\u0433\u0430\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b\u043e\u043c","Reoviridae, \u0421aliciviridae, Astroviridae, Picornaviridae","\u0431\u0435\u0448\u0435\u043d\u0441\u0442\u0432\u043e","\u0441\u043e\u0437\u0434\u0430\u043d\u0438\u0435 \u0444\u0430\u0433\u043e\u0446\u0438\u0442\u0430\u0440\u043d\u043e\u0439 \u0442\u0435\u043e\u0440\u0438\u0438 \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442\u0430"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0442\u0440\u0435\u0431\u043e\u0432\u0430\u043d\u0438\u044f \u043f\u0440\u0435\u0434\u044a\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u043a \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u043c \u0441\u0440\u0435\u0434\u0430\u043c?","\u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c, \u043e\u043f\u0442\u0438\u043c\u0443\u043c Ph, \u0438\u0437\u043e\u0442\u043e\u043d\u0438\u0447\u043d\u043e\u0441\u0442\u044c, \u0441\u0442\u0435\u0440\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c","\u0441\u043a\u043e\u043d\u0441\u0442\u0440\u0443\u0438\u0440\u043e\u0432\u0430\u043b \u043c\u0438\u043a\u0440\u043e\u0441\u043a\u043e\u043f \u0438 \u043f\u0435\u0440\u0432\u044b\u043c \u0443\u0432\u0438\u0434\u0435\u043b \u0438 \u0437\u0430\u0440\u0438\u0441\u043e\u0432\u0430\u043b \u043c\u0438\u043a\u0440\u043e\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u044b","\u0420\u0418\u0424 \u0438\u043b\u0438 \u041f\u0426\u0420","\u0444\u043e\u0442\u043e\u0430\u0432\u0442\u043e\u0442\u0440\u043e\u0444\u044b"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043f\u043e \u0440\u0430\u0437\u043b\u043e\u0436\u0435\u043d\u0438\u044e \u043a\u0430\u043a\u0438\u0445 \u0432\u0435\u0449\u0435\u0441\u0442\u0432 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u044f\u0442 \u0438\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u044e \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439?","\u0440\u0430\u0441\u0449\u0435\u043f\u043b\u044f\u0442\u044c \u0443\u0433\u043b\u0435\u0432\u043e\u0434\u044b, \u0441\u043f\u0438\u0440\u0442\u044b, \u0431\u0435\u043b\u043a\u0438 \u0441 \u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u043e\u0432","\u0433\u043e\u043b\u043e\u0432\u043a\u0430 \u0438 \u0445\u0432\u043e\u0441\u0442\u043e\u0432\u043e\u0439 \u043e\u0442\u0440\u043e\u0441\u0442\u043e\u043a","Reoviridae, \u0421aliciviridae, Astroviridae, Picornaviridae","\u0441\u043f\u0438\u0440\u0430\u043b\u044c\u043d\u043e\u043c\u0443, \u0438\u043a\u043e\u0441\u0430\u044d\u0434\u0440\u0438\u0447\u0435\u0441\u043a\u043e\u043c\u0443 \u0438 \u0441\u043b\u043e\u0436\u043d\u043e\u043c\u0443"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u0441\u0440\u0435\u0434\u044b \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u044e\u0442\u0441\u044f \u0434\u043b\u044f \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u0430\u043d\u0430\u044d\u0440\u043e\u0431\u043e\u0432?","\u041a\u0438\u0442\u0442\u0430-\u0422\u0430\u0440\u043e\u0446\u0446\u0438, \u0442\u0438\u043e\u0433\u043b\u0438\u043a\u043e\u043b\u0435\u0432\u0430\u044f \u0441\u0440\u0435\u0434\u0430","\u0441\u0435\u043c\u0435\u0439\u0441\u0442\u0432\u0443 paramyxoviridae","\u0440\u0430\u0441\u0449\u0435\u043f\u043b\u044f\u0442\u044c \u0443\u0433\u043b\u0435\u0432\u043e\u0434\u044b, \u0441\u043f\u0438\u0440\u0442\u044b, \u0431\u0435\u043b\u043a\u0438 \u0441 \u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u043e\u0432","\u0444\u043e\u0440\u043c\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0438\u043c\u043c\u0443\u043d\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043f\u0430\u043c\u044f\u0442\u0438, \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u0435 \u0432\u0442\u043e\u0440\u0438\u0447\u043d\u043e\u0433\u043e \u0438\u043c\u043c\u0443\u043d\u043d\u043e\u0433\u043e \u043e\u0442\u0432\u0435\u0442\u0430"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u043c \u043c\u0435\u0442\u043e\u0434\u043e\u043c \u0441\u0442\u0435\u0440\u0438\u043b\u0438\u0437\u0443\u044e\u0442 \u0441\u0442\u0435\u043a\u043b\u044f\u043d\u043d\u0443\u044e \u043f\u043e\u0441\u0443\u0434\u0443?","\u043c\u0435\u0442\u043e\u0434\u043e\u043c \u0441\u0443\u0445\u043e\u0433\u043e \u0436\u0430\u0440\u0430","\u0433\u0435\u043c\u0430\u0433\u0433\u043b\u044e\u0442\u0438\u043d\u0438\u043d, \u043d\u0435\u0439\u0440\u0430\u043c\u0438\u043d\u0438\u0434\u0430\u0437\u0443","\u043f\u0438\u0442\u0430\u044e\u0442\u0441\u044f \u043c\u0435\u0440\u0442\u0432\u044b\u043c \u043e\u0440\u0433\u0430\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b\u043e\u043c","\u041a\u0438\u0442\u0442\u0430-\u0422\u0430\u0440\u043e\u0446\u0446\u0438, \u0442\u0438\u043e\u0433\u043b\u0438\u043a\u043e\u043b\u0435\u0432\u0430\u044f \u0441\u0440\u0435\u0434\u0430"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u0434\u043b\u044f \u043a\u0430\u043a\u0438\u0445 \u043c\u0438\u043a\u0440\u043e\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u043e\u0432 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u044e\u0442 \u0430\u043d\u0442\u0438\u0431\u0438\u043e\u0442\u0438\u043a\u043e\u0433\u0440\u0430\u043c\u043c\u0443?","\u0434\u043b\u044f \u0447\u0438\u0441\u0442\u044b\u0445 \u043a\u0443\u043b\u044c\u0442\u0443\u0440 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439","\u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442 \u043d\u0430\u0441\u043b\u0435\u0434\u0441\u0442\u0432\u0435\u043d\u043d\u0443\u044e (\u0433\u0435\u043d\u043e\u043c\u043d\u0443\u044e) \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0438 \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u043c\u0430\u0442\u0440\u0438\u0447\u043d\u043e\u0439, \u0438\u043b\u0438 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u043e\u043d\u043d\u043e\u0439 \u0420\u041d\u041a","\u0420\u0418\u0424 \u0438\u043b\u0438 \u041f\u0426\u0420","\u0440\u0430\u0441\u0449\u0435\u043f\u043b\u044f\u0442\u044c \u0443\u0433\u043b\u0435\u0432\u043e\u0434\u044b, \u0441\u043f\u0438\u0440\u0442\u044b, \u0431\u0435\u043b\u043a\u0438 \u0441 \u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u043e\u0432"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0440\u0435\u0430\u043a\u0446\u0438\u0438 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u044e\u0442\u0441\u044f \u0434\u043b\u044f \u043e\u0446\u0435\u043d\u043a\u0438 \u0438\u043c\u043c\u0443\u043d\u043d\u043e\u0433\u043e \u0441\u0442\u0430\u0442\u0443\u0441\u0430 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u0430?","\u0440\u0435\u0430\u043a\u0446\u0438\u0438 \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442\u0430: \u0418\u0424\u0410,\u0420\u0421\u041a,\u0420\u041d,\u0420\u0422\u0413\u0410, \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043f\u0440\u0435\u0446\u0438\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438","\u0431\u0435\u0448\u0435\u043d\u0441\u0442\u0432\u043e","\u0432\u0438\u0440\u0443\u0441\u0430 \u0433\u0435\u043f\u0430\u0442\u0438\u0442\u0430 D","\u043e\u0431\u043e\u0441\u043d\u043e\u0432\u0430\u043b \u043f\u0440\u0438\u043d\u0446\u0438\u043f \u0432\u0430\u043a\u0446\u0438\u043d\u0430\u0446\u0438\u0438 \u0438 \u0441\u043f\u043e\u0441\u043e\u0431 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f \u0432\u0430\u043a\u0446\u0438\u043d"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u043f\u0440\u043e\u0446\u0435\u0441\u0441, \u0437\u0430\u0449\u0438\u0449\u0430\u0435\u0442 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c \u043e\u0442 \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u044b\u0445 \u0430\u043d\u0442\u0438\u0433\u0435\u043d\u043d\u044b\u0445 \u0438\u043d\u0442\u0435\u0440\u0432\u0435\u043d\u0446\u0438\u0439?","\u0444\u043e\u0440\u043c\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0438\u043c\u043c\u0443\u043d\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043f\u0430\u043c\u044f\u0442\u0438, \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u0435 \u0432\u0442\u043e\u0440\u0438\u0447\u043d\u043e\u0433\u043e \u0438\u043c\u043c\u0443\u043d\u043d\u043e\u0433\u043e \u043e\u0442\u0432\u0435\u0442\u0430","\u0441\u0440\u0435\u0434\u0430 \u0421\u0430\u0431\u0443\u0440\u043e","\u0436\u0438\u0432\u044b\u0445 \u043e\u0441\u043b\u0430\u0431\u043b\u0435\u043d\u043d\u044b\u0445 \u043c\u0438\u043a\u043e\u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439 \u0431\u044b\u0447\u044c\u0435\u0433\u043e \u0442\u0438\u043f\u0430","Reoviridae, \u0421aliciviridae, Astroviridae, Picornaviridae"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u0441 \u043f\u043e\u043c\u043e\u0449\u044c\u044e \u043a\u0430\u043a\u043e\u0439 \u0440\u0435\u0430\u043a\u0446\u0438\u0438 \u043c\u043e\u0436\u0435\u043c \u043e\u0431\u043d\u0430\u0440\u0443\u0436\u0438\u0442\u044c \u0432\u0438\u0440\u0443\u0441\u044b \u0433\u0435\u0440\u043f\u0435\u0441\u0430 \u0432 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u043c\u043e\u043c \u0432\u0435\u0437\u0438\u043a\u0443\u043b?","\u0420\u0418\u0424 \u0438\u043b\u0438 \u041f\u0426\u0420","\u0432 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u0435 \u043b\u0430\u0431\u043e\u0440\u0430\u0442\u043e\u0440\u043d\u044b\u0445 \u0436\u0438\u0432\u043e\u0442\u043d\u044b\u0445, \u0432 \u0440\u0430\u0437\u0432\u0438\u0432\u0430\u044e\u0449\u0438\u0445\u0441\u044f \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430\u0445 \u043f\u0442\u0438\u0446 (\u0447\u0430\u0449\u0435 \u043d\u0430 \u043a\u0443\u0440\u0438\u043d\u044b\u0445 \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430\u0445) \u0438 \u043a\u0443\u043b\u044c\u0442\u0443\u0440\u0430\u0445 \u043a\u043b\u0435\u0442\u043e\u043a (\u0442\u043a\u0430\u043d\u0435\u0439)","\u0436\u0438\u0432\u044b\u0445 \u043e\u0441\u043b\u0430\u0431\u043b\u0435\u043d\u043d\u044b\u0445 \u043c\u0438\u043a\u043e\u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439 \u0431\u044b\u0447\u044c\u0435\u0433\u043e \u0442\u0438\u043f\u0430","\u0440\u0435\u0430\u043a\u0446\u0438\u0438 \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442\u0430: \u0418\u0424\u0410,\u0420\u0421\u041a,\u0420\u041d,\u0420\u0422\u0413\u0410, \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043f\u0440\u0435\u0446\u0438\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u0434\u043b\u044f \u0440\u0435\u043f\u0440\u043e\u0434\u0443\u043a\u0446\u0438\u0438 \u043a\u0430\u043a\u043e\u0433\u043e \u0432\u0438\u0440\u0443\u0441\u0430 \u0433\u0435\u043f\u0430\u0442\u0438\u0442\u0430 \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c \u0432\u0438\u0440\u0443\u0441 \u2013 \u00ab\u043f\u043e\u043c\u043e\u0449\u043d\u0438\u043a\u00bb?","\u0432\u0438\u0440\u0443\u0441\u0430 \u0433\u0435\u043f\u0430\u0442\u0438\u0442\u0430 D","\u0433\u0435\u043c\u0430\u0433\u0433\u043b\u044e\u0442\u0438\u043d\u0438\u043d, \u043d\u0435\u0439\u0440\u0430\u043c\u0438\u043d\u0438\u0434\u0430\u0437\u0443","\u0440\u0435\u0430\u043a\u0446\u0438\u0438 \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442\u0430: \u0418\u0424\u0410,\u0420\u0421\u041a,\u0420\u041d,\u0420\u0422\u0413\u0410, \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043f\u0440\u0435\u0446\u0438\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438","\u0440\u0430\u0437\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u043c\u0435\u0442\u043e\u0434\u043e\u0432 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f \u0447\u0438\u0441\u0442\u044b\u0445 \u043a\u0443\u043b\u044c\u0442\u0443\u0440"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0438\u0437 \u043f\u0435\u0440\u0435\u0447\u0438\u0441\u043b\u0435\u043d\u043d\u044b\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0439 \u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u00ab\u0431\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u0442\u0443\u043f\u0438\u043a\u043e\u043c\u00bb?","\u0431\u0435\u0448\u0435\u043d\u0441\u0442\u0432\u043e","\u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u043d\u0430 \u0438\u0441\u043a\u0443\u0441\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0441\u0440\u0435\u0434\u0430\u0445","\u043a\u043e\u043d\u044a\u044e\u0433\u0430\u0446\u0438\u044f, \u0442\u0440\u0430\u043d\u0441\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044f \u0438 \u0442\u0440\u0430\u043d\u0441\u0434\u0443\u043a\u0446\u0438\u044f","\u0433\u0435\u043d\u043d\u0430\u044f \u0438\u043b\u0438 \u0442\u043e\u0447\u0435\u0447\u043d\u0430\u044f \u043c\u0443\u0442\u0430\u0446\u0438\u044f"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u0438 \u043a\u0430\u043a\u0438\u0445 \u0441\u0435\u043c\u0435\u0439\u0441\u0442\u0432 \u043c\u0438\u043a\u0440\u043e\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u043e\u0432 \u043c\u043e\u0433\u0443\u0442 \u0432\u044b\u0437\u044b\u0432\u0430\u0442\u044c \u0432\u0438\u0440\u0443\u0441\u043d\u044b\u0435 \u0433\u0430\u0441\u0442\u0440\u043e\u044d\u043d\u0442\u0435\u0440\u0438\u0442\u044b?","Reoviridae, \u0421aliciviridae, Astroviridae, Picornaviridae","\u0444\u0435\u043d\u043e\u0442\u0438\u043f\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430( \u043c\u043e\u0440\u0444\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u0435, \u043a\u0443\u043b\u044c\u0442\u0443\u0440\u0430\u043b\u044c\u043d\u044b\u0435 \u0438 \u0431\u0438\u043e\u0445\u0438\u043c)","\u043f\u0438\u0442\u0430\u044e\u0442\u0441\u044f \u043c\u0435\u0440\u0442\u0432\u044b\u043c \u043e\u0440\u0433\u0430\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b\u043e\u043c","\u0433\u043e\u043b\u043e\u0432\u043a\u0430 \u0438 \u0445\u0432\u043e\u0441\u0442\u043e\u0432\u043e\u0439 \u043e\u0442\u0440\u043e\u0441\u0442\u043e\u043a"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u0447\u0442\u043e \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u043b\u044f\u044e\u0442 \u0441\u043e\u0431\u043e\u0439 \u0448\u0438\u043f\u044b \u043e\u0440\u0442\u043e\u043c\u0438\u043a\u0441\u043e\u0432\u0438\u0440\u0443\u0441\u043e\u0432?","\u0433\u0435\u043c\u0430\u0433\u0433\u043b\u044e\u0442\u0438\u043d\u0438\u043d, \u043d\u0435\u0439\u0440\u0430\u043c\u0438\u043d\u0438\u0434\u0430\u0437\u0443","\u0441\u0430\u0445\u0430\u0440\u043d\u044b\u0439 \u0431\u0443\u043b\u044c\u043e\u043d, \u0441\u0440\u0435\u0434\u0430 \u043e\u0431\u0430\u0433\u0430\u0449\u0435\u043d\u043d\u044b\u0435 \u0443\u0433\u043b\u0435\u0432\u043e\u0434\u0430\u043c\u0438","\u0433\u043e\u043b\u043e\u0432\u043a\u0430 \u0438 \u0445\u0432\u043e\u0441\u0442\u043e\u0432\u043e\u0439 \u043e\u0442\u0440\u043e\u0441\u0442\u043e\u043a","\u043a\u0440\u043e\u0432\u044f\u043d\u043e\u0439 \u0430\u0433\u0430\u0440, \u0441\u0430\u0431\u0443\u0440\u043e, \u0427\u0430\u043f\u0435\u043a\u0430"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a \u043a\u0430\u043a\u043e\u043c\u0443 \u0441\u0435\u043c\u0435\u0439\u0441\u0442\u0432\u0443 \u0432\u0438\u0440\u0443\u0441\u043e\u0432 \u043f\u0440\u0438\u043d\u0430\u0434\u043b\u0435\u0436\u0438\u0442 \u0412\u0418\u0427?","\u0441\u0435\u043c\u0435\u0439\u0441\u0442\u0432\u0443 Retroviridae, \u0440\u043e\u0434\u0443 Lentivirus","\u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442 \u043d\u0430\u0441\u043b\u0435\u0434\u0441\u0442\u0432\u0435\u043d\u043d\u0443\u044e (\u0433\u0435\u043d\u043e\u043c\u043d\u0443\u044e) \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0438 \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u043c\u0430\u0442\u0440\u0438\u0447\u043d\u043e\u0439, \u0438\u043b\u0438 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u043e\u043d\u043d\u043e\u0439 \u0420\u041d\u041a","\u0434\u043b\u044f \u0447\u0438\u0441\u0442\u044b\u0445 \u043a\u0443\u043b\u044c\u0442\u0443\u0440 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439","\u041a\u0438\u0442\u0442\u0430-\u0422\u0430\u0440\u043e\u0446\u0446\u0438, \u0442\u0438\u043e\u0433\u043b\u0438\u043a\u043e\u043b\u0435\u0432\u0430\u044f \u0441\u0440\u0435\u0434\u0430"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u043e\u0441\u043d\u043e\u0432\u043d\u0430\u044f \u043f\u0430\u0442\u043e\u0433\u0435\u043d\u0435\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0437\u043d\u0430\u0447\u0438\u043c\u0430\u044f \u043c\u0438\u0448\u0435\u043d\u044c \u0434\u043b\u044f \u0412\u0418\u0427?","\u043a\u043b\u0435\u0442\u043a\u0438 \u043d\u0435\u0441\u0443\u0449\u0438\u0435 \u043d\u0430 \u043f\u043e\u0432\u0435\u0440\u0445\u043d\u043e\u0441\u0442\u0438 \u0440\u0435\u0446\u0435\u043f\u0442\u043e\u0440 CD4: \u043f\u0440\u0435\u0436\u0434\u0435 \u0432\u0441\u0435\u0433\u043e \u0422 \u0445\u0435\u043b\u043f\u0435\u0440, \u043c\u0430\u043a\u0440\u043e\u0444\u0430\u0433\u0438, \u0434\u0435\u043d\u0434\u0440\u0438\u0442\u043d\u044b\u0435 \u043a\u043b\u0435\u0442\u043a\u0438","\u043f\u0440\u043e\u043a\u0430\u0440\u0438\u043e\u0442\u044b, \u0440\u0430\u0437\u043c\u0435\u0440\u044b \u043c\u0435\u043b\u043a\u0438\u0435, \u0440\u0430\u0437\u043c\u043d\u043e\u0436\u0430.\u0442\u0441\u044f \u0434\u0435\u043b\u0435\u043d\u0438\u0435\u043c","\u043a\u043e\u043d\u044a\u044e\u0433\u0430\u0446\u0438\u044f, \u0442\u0440\u0430\u043d\u0441\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044f \u0438 \u0442\u0440\u0430\u043d\u0441\u0434\u0443\u043a\u0446\u0438\u044f","\u0433\u043e\u043b\u043e\u0432\u043a\u0430 \u0438 \u0445\u0432\u043e\u0441\u0442\u043e\u0432\u043e\u0439 \u043e\u0442\u0440\u043e\u0441\u0442\u043e\u043a"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u043e\u043d\u0442\u0430\u043a\u0442 \u0441 \u043a\u0430\u043a\u0438\u043c \u0431\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b\u043e\u043c \u0436\u0438\u0432\u043e\u0442\u043d\u044b\u0445 \u043d\u0430\u0438\u0431\u043e\u043b\u0435\u0435 \u043e\u043f\u0430\u0441\u0435\u043d \u0432 \u043e\u0442\u043d\u043e\u0448\u0435\u043d\u0438\u0438 \u0437\u0430\u0440\u0430\u0436\u0435\u043d\u0438\u044f \u0431\u0440\u0443\u0446\u0435\u043b\u043b\u0435\u0437\u043e\u043c?","\u043e\u043a\u043e\u043b\u043e\u043f\u043b\u043e\u0434\u043d\u044b\u0435 \u0432\u043e\u0434\u044b, \u043c\u043e\u043b\u043e\u043a\u043e, \u043c\u043e\u0447\u0430 \u0438 \u0438\u0441\u043f\u0440\u0430\u0436\u043d\u0435\u043d\u0438\u044f","\u0420\u0418\u0424 \u0438\u043b\u0438 \u041f\u0426\u0420","\u0440\u0435\u0430\u043a\u0446\u0438\u0438 \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442\u0430: \u0418\u0424\u0410,\u0420\u0421\u041a,\u0420\u041d,\u0420\u0422\u0413\u0410, \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043f\u0440\u0435\u0446\u0438\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438","\u0441\u0440\u0435\u0434\u0430 \u0421\u0430\u0431\u0443\u0440\u043e"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0432\u0438\u0440\u0443\u0441\u043d\u0430\u044f \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u044f \u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0438\u0441\u043a\u043b\u044e\u0447\u0438\u0442\u0435\u043b\u044c\u043d\u043e \u0432\u0430\u043a\u0446\u0438\u043d\u043e\u0443\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u043c\u043e\u0439?","\u043d\u0430\u0442\u0443\u0440\u0430\u043b\u044c\u043d\u0430\u044f \u043e\u0441\u043f\u0430","\u043a\u043e\u0434\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0434\u043e\u043f \u0441\u0432\u043e\u0439\u0441\u0442\u0432: \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c \u043a \u0430\u043d\u0442\u0438\u0431\u0438\u043e\u0442\u0438\u043a\u0430\u043c, \u043f\u0440\u043e\u0434\u0443\u043a\u0446\u0438\u044f \u0442\u043e\u043a\u0441\u0438\u043d\u043e\u0432 \u0438\u043b\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u0446\u0438\u043d\u043e\u0432","\u043b\u0435\u043f\u0442\u043e\u0441\u043f\u0438\u0440\u043e\u0437","\u0438\u0437 \u043e\u0434\u043d\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u0442\u043a\u0430 \u0414\u041d\u041a \u0432 \u0434\u0440\u0443\u0433\u043e\u0439"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430 \u043f\u0440\u0438\u0441\u0443\u0449\u0438 \u0432\u043e\u0437\u0431\u0443\u0434\u0438\u0442\u0435\u043b\u044f\u043c \u0442\u0443\u0431\u0435\u0440\u043a\u0443\u043b\u0435\u0437\u0430?","\u043a\u0438\u0441\u043b\u043e\u0442\u043e\u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c, \u043c\u0435\u0434\u043b\u0435\u043d\u043d\u044b\u0439 \u0440\u043e\u0441\u0442 \u043d\u0430 \u043f\u0438\u0442 \u0441\u0440\u0435\u0434\u0430\u0445, \u0441\u043f\u043e\u0441\u043e\u0431\u043d\u043e\u0441\u0442\u044c \u043a \u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u043c\u0443 \u0432\u044b\u0436\u0438\u0432\u0430\u043d\u0438\u044e \u0432\u043d\u0443\u0442\u0440\u0438 \u043c\u0430\u043a\u0440\u043e\u0444\u0430\u0433\u043e\u0432","\u0441\u0435\u043c\u0435\u0439\u0441\u0442\u0432\u0443 Retroviridae, \u0440\u043e\u0434\u0443 Lentivirus","\u0444\u043e\u0442\u043e\u0430\u0432\u0442\u043e\u0442\u0440\u043e\u0444\u044b","\u043f\u0430\u0442\u043e\u0433\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u0438 \u0432\u0438\u0440\u0443\u043b\u0435\u043d\u0442\u043d\u043e\u0441\u0442\u044c"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043a \u043a\u0430\u043a\u043e\u043c\u0443 \u0441\u0435\u043c\u0435\u0439\u0441\u0442\u0432\u0443 \u043e\u0442\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u0432\u0438\u0440\u0443\u0441 \u043a\u043e\u0440\u0438?","\u0441\u0435\u043c\u0435\u0439\u0441\u0442\u0432\u0443 paramyxoviridae","\u0431\u0435\u0448\u0435\u043d\u0441\u0442\u0432\u043e","\u0433\u0435\u043c\u0430\u0433\u0433\u043b\u044e\u0442\u0438\u043d\u0438\u043d, \u043d\u0435\u0439\u0440\u0430\u043c\u0438\u043d\u0438\u0434\u0430\u0437\u0443","\u043d\u0430\u0442\u0443\u0440\u0430\u043b\u044c\u043d\u0430\u044f \u043e\u0441\u043f\u0430"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u044f \u043f\u0435\u0440\u0435\u0434\u0430\u0435\u0442\u0441\u044f \u043f\u043e\u0441\u043b\u0435 \u043a\u0443\u043f\u0430\u043d\u0438\u044f \u0432 \u043e\u0442\u043a\u0440\u044b\u0442\u043e\u043c \u0432\u043e\u0434\u043e\u0435\u043c\u0435?","\u043b\u0435\u043f\u0442\u043e\u0441\u043f\u0438\u0440\u043e\u0437","\u0431\u0435\u0448\u0435\u043d\u0441\u0442\u0432\u043e","\u0432\u0438\u0440\u0443\u0441\u044b","\u043c\u0435\u0442\u043e\u0434\u043e\u043c \u0441\u0443\u0445\u043e\u0433\u043e \u0436\u0430\u0440\u0430"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u044d\u043b\u0435\u043a\u0442\u0438\u0432\u043d\u0430\u044f \u0441\u0440\u0435\u0434\u0430 \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c\u0430 \u0434\u043b\u044f \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f Candida albicans?","\u0441\u0440\u0435\u0434\u0430 \u0421\u0430\u0431\u0443\u0440\u043e","\u0434\u0438\u0444\u0442\u0435\u0440\u0438\u044f, \u0441\u0442\u043e\u043b\u0431\u043d\u044f\u043a, \u0431\u043e\u0442\u0443\u043b\u0438\u0437\u043c \u0438 \u0433\u0430\u0437\u043e\u0432\u0430\u044f \u0433\u0430\u043d\u0433\u0440\u0435\u043d\u0430","\u0433\u0435\u043c\u0430\u0433\u0433\u043b\u044e\u0442\u0438\u043d\u0438\u043d, \u043d\u0435\u0439\u0440\u0430\u043c\u0438\u043d\u0438\u0434\u0430\u0437\u0443","\u0441\u043f\u043e\u0440\u0430\u0434\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u0435\u043c\u043e\u0441\u0442\u044c\u044e"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u043f\u0440\u0438\u0437\u043d\u0430\u043a\u0438 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u044b \u0434\u043b\u044f Mycobacterium leprae?","\u043e\u0431\u043b\u0438\u0433\u0430\u0442\u043d\u044b\u0435 \u0432\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u0435 \u043f\u0430\u0440\u0430\u0437\u0438\u0442\u044b, \u043a\u0438\u0441\u043b\u043e\u0442\u043e\u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c, \u0440\u0430\u0441\u043f\u043e\u043b\u0430\u0433\u0430\u044e\u0442\u0441\u044f \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u043e","\u043a\u043e\u043c\u043c\u0435\u043d\u0441\u0430\u043b\u043e\u043c","\u0432\u0438\u0440\u0443\u0441\u0430 \u0433\u0435\u043f\u0430\u0442\u0438\u0442\u0430 D","\u043c\u0435\u0442\u043e\u0434\u043e\u043c \u0441\u0443\u0445\u043e\u0433\u043e \u0436\u0430\u0440\u0430"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u0438\u0437 \u0447\u0435\u0433\u043e \u0441\u043e\u0441\u0442\u043e\u0438\u0442 \u0432\u0430\u043a\u0446\u0438\u043d\u0430 \u0411\u0426\u0416?","\u0436\u0438\u0432\u044b\u0445 \u043e\u0441\u043b\u0430\u0431\u043b\u0435\u043d\u043d\u044b\u0445 \u043c\u0438\u043a\u043e\u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439 \u0431\u044b\u0447\u044c\u0435\u0433\u043e \u0442\u0438\u043f\u0430","\u043a\u043e\u0434\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0434\u043e\u043f \u0441\u0432\u043e\u0439\u0441\u0442\u0432: \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c \u043a \u0430\u043d\u0442\u0438\u0431\u0438\u043e\u0442\u0438\u043a\u0430\u043c, \u043f\u0440\u043e\u0434\u0443\u043a\u0446\u0438\u044f \u0442\u043e\u043a\u0441\u0438\u043d\u043e\u0432 \u0438\u043b\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u0446\u0438\u043d\u043e\u0432","\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0431\u0435\u043b\u043a\u0430\u0438\u043c\u0438, \u043e\u0431\u043b\u0430\u0434\u0430\u044e\u0442 \u0432\u044b\u0441\u043e\u043a\u043e\u0439 \u0442\u043e\u043a\u0441\u0438\u0447\u043d\u043e\u0441\u0442\u044c\u044e, \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u043d\u043e\u0441\u0442\u044c\u044e \u0438 \u0442\u0435\u0440\u043c\u043e\u043b\u0430\u0431\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c\u044e","\u0433\u0435\u043d\u043d\u0430\u044f \u0438\u043b\u0438 \u0442\u043e\u0447\u0435\u0447\u043d\u0430\u044f \u043c\u0443\u0442\u0430\u0446\u0438\u044f"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043d\u0430 \u043a\u0430\u043a\u043e\u0439 \u0441\u0440\u0435\u0434\u0435 \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u0443\u044e\u0442\u0441\u044f \u0430\u043a\u0442\u0438\u043d\u043e\u043c\u0438\u0446\u0435\u0442\u044b?","\u043a\u0440\u043e\u0432\u044f\u043d\u043e\u0439 \u0430\u0433\u0430\u0440, \u0441\u0430\u0431\u0443\u0440\u043e, \u0427\u0430\u043f\u0435\u043a\u0430","\u0438\u0437 \u043e\u0434\u043d\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u0442\u043a\u0430 \u0414\u041d\u041a \u0432 \u0434\u0440\u0443\u0433\u043e\u0439","\u0442\u0435\u0440\u043c\u043e\u0441\u0442\u0430\u0431\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c,","\u0433\u0435\u043c\u0430\u0433\u0433\u043b\u044e\u0442\u0438\u043d\u0438\u043d, \u043d\u0435\u0439\u0440\u0430\u043c\u0438\u043d\u0438\u0434\u0430\u0437\u0443"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u043c\u0438 \u043c\u043e\u0440\u0444\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u043c\u0438 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430\u043c\u0438 \u043e\u0442\u043b\u0438\u0447\u0430\u044e\u0442\u0441\u044f \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0438 \u043e\u0442 \u0433\u0440\u0438\u0431\u043e\u0432?","\u043f\u0440\u043e\u043a\u0430\u0440\u0438\u043e\u0442\u044b, \u0440\u0430\u0437\u043c\u0435\u0440\u044b \u043c\u0435\u043b\u043a\u0438\u0435, \u0440\u0430\u0437\u043c\u043d\u043e\u0436\u0430.\u0442\u0441\u044f \u0434\u0435\u043b\u0435\u043d\u0438\u0435\u043c","\u043a\u043e\u043c\u043c\u0435\u043d\u0441\u0430\u043b\u043e\u043c","Reoviridae, \u0421aliciviridae, Astroviridae, Picornaviridae","\u0432\u0438\u0440\u0443\u0441\u0430 \u0433\u0435\u043f\u0430\u0442\u0438\u0442\u0430 D"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0436\u0438\u0434\u043a\u0430\u044f \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0441\u0440\u0435\u0434\u0430 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0434\u043b\u044f \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u043e\u0432?","\u0441\u0430\u0445\u0430\u0440\u043d\u044b\u0439 \u0431\u0443\u043b\u044c\u043e\u043d, \u0441\u0440\u0435\u0434\u0430 \u043e\u0431\u0430\u0433\u0430\u0449\u0435\u043d\u043d\u044b\u0435 \u0443\u0433\u043b\u0435\u0432\u043e\u0434\u0430\u043c\u0438","\u0431\u0435\u0448\u0435\u043d\u0441\u0442\u0432\u043e","\u043a\u0438\u0441\u043b\u043e\u0442\u043e\u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c, \u043c\u0435\u0434\u043b\u0435\u043d\u043d\u044b\u0439 \u0440\u043e\u0441\u0442 \u043d\u0430 \u043f\u0438\u0442 \u0441\u0440\u0435\u0434\u0430\u0445, \u0441\u043f\u043e\u0441\u043e\u0431\u043d\u043e\u0441\u0442\u044c \u043a \u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u043c\u0443 \u0432\u044b\u0436\u0438\u0432\u0430\u043d\u0438\u044e \u0432\u043d\u0443\u0442\u0440\u0438 \u043c\u0430\u043a\u0440\u043e\u0444\u0430\u0433\u043e\u0432","Reoviridae, \u0421aliciviridae, Astroviridae, Picornaviridae"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a \u043d\u0430\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u043c\u0435\u0445\u0430\u043d\u0438\u0437\u043c \u043c\u0443\u0442\u0430\u0446\u0438\u0439 \u0432 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0435 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0439 \u043f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u0438 \u043d\u0443\u043a\u043b\u0435\u043e\u0442\u0438\u0434\u043e\u0432 \u0432 \u0414\u041d\u041a?","\u0433\u0435\u043d\u043d\u0430\u044f \u0438\u043b\u0438 \u0442\u043e\u0447\u0435\u0447\u043d\u0430\u044f \u043c\u0443\u0442\u0430\u0446\u0438\u044f","\u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0430\u043b\u044c\u043d\u0430\u044f \u0445\u0440\u043e\u043c\u043e\u0441\u043e\u043c\u0430, \u043f\u043b\u0430\u0437\u043c\u0438\u0434\u044b, \u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0437\u043e\u043d\u044b, IS-\u044d\u043b\u0435\u043c\u0435\u043d\u0442\u044b","\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0431\u0435\u043b\u043a\u0430\u0438\u043c\u0438, \u043e\u0431\u043b\u0430\u0434\u0430\u044e\u0442 \u0432\u044b\u0441\u043e\u043a\u043e\u0439 \u0442\u043e\u043a\u0441\u0438\u0447\u043d\u043e\u0441\u0442\u044c\u044e, \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u043d\u043e\u0441\u0442\u044c\u044e \u0438 \u0442\u0435\u0440\u043c\u043e\u043b\u0430\u0431\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c\u044e","\u043a\u043e\u043d\u044a\u044e\u0433\u0430\u0446\u0438\u044f, \u0442\u0440\u0430\u043d\u0441\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044f \u0438 \u0442\u0440\u0430\u043d\u0441\u0434\u0443\u043a\u0446\u0438\u044f"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430 \u043f\u0440\u0435\u043e\u0431\u0440\u0430\u0437\u0443\u044e\u0442\u0441\u044f \u0443 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439 \u043f\u0440\u0438 \u043c\u043e\u0434\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438?","\u0444\u0435\u043d\u043e\u0442\u0438\u043f\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430( \u043c\u043e\u0440\u0444\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u0435, \u043a\u0443\u043b\u044c\u0442\u0443\u0440\u0430\u043b\u044c\u043d\u044b\u0435 \u0438 \u0431\u0438\u043e\u0445\u0438\u043c)","\u0433\u0435\u043d\u043d\u0430\u044f \u0438\u043b\u0438 \u0442\u043e\u0447\u0435\u0447\u043d\u0430\u044f \u043c\u0443\u0442\u0430\u0446\u0438\u044f","\u0434\u043b\u044f \u0444\u0430\u043b\u044c\u0441\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u0438 \u043e\u0431\u043d\u0430\u0440\u0443\u0436\u0435\u043d\u0438\u044f \u043f\u0440\u0438\u043c\u0435\u0441\u0435\u0439","\u0432\u0438\u0440\u0443\u0441\u0430 \u0433\u0435\u043f\u0430\u0442\u0438\u0442\u0430 D"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u0438\u0437 \u044d\u0442\u0438\u0445 \u0431\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u043e\u0432 \u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u043c\u0435\u0445\u0430\u043d\u0438\u0437\u043c\u043e\u043c \u0433\u0435\u043d\u0435\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0440\u0435\u043a\u043e\u043c\u0431\u0438\u043d\u0430\u0446\u0438\u0438?","\u043a\u043e\u043d\u044a\u044e\u0433\u0430\u0446\u0438\u044f, \u0442\u0440\u0430\u043d\u0441\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044f \u0438 \u0442\u0440\u0430\u043d\u0441\u0434\u0443\u043a\u0446\u0438\u044f","\u043d\u0430\u0442\u0443\u0440\u0430\u043b\u044c\u043d\u0430\u044f \u043e\u0441\u043f\u0430","\u043b\u0435\u043f\u0442\u043e\u0441\u043f\u0438\u0440\u043e\u0437","\u043a\u043e\u0434\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0434\u043e\u043f \u0441\u0432\u043e\u0439\u0441\u0442\u0432: \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c \u043a \u0430\u043d\u0442\u0438\u0431\u0438\u043e\u0442\u0438\u043a\u0430\u043c, \u043f\u0440\u043e\u0434\u0443\u043a\u0446\u0438\u044f \u0442\u043e\u043a\u0441\u0438\u043d\u043e\u0432 \u0438\u043b\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u0446\u0438\u043d\u043e\u0432"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u044b \u0443\u0447\u0430\u0441\u0442\u0432\u0443\u044e\u0442 \u0432 \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0435 \u0433\u0435\u043d\u0435\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u0438 \u0443 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439?","\u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0430\u043b\u044c\u043d\u0430\u044f \u0445\u0440\u043e\u043c\u043e\u0441\u043e\u043c\u0430, \u043f\u043b\u0430\u0437\u043c\u0438\u0434\u044b, \u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0437\u043e\u043d\u044b, IS-\u044d\u043b\u0435\u043c\u0435\u043d\u0442\u044b","\u0444\u0430\u0433\u043e\u0446\u0438\u0442\u0438\u0440\u0443\u044e\u0449\u0438\u0435 \u043a\u043b\u0435\u0442\u043a\u0438( \u043d\u0435\u0439\u0442\u0440\u043e\u0444\u0438\u043b\u044b \u0438 \u043c\u0430\u043a\u0440\u043e\u0444\u0430\u0433\u0438) \u0430 \u0442\u0430\u043a\u0436\u0435 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0435 \u043a\u0438\u043b\u043b\u0435\u0440\u044b (NK-\u043a\u043b\u0435\u0442\u043a\u0438)","\u043a\u043e\u0434\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0434\u043e\u043f \u0441\u0432\u043e\u0439\u0441\u0442\u0432: \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c \u043a \u0430\u043d\u0442\u0438\u0431\u0438\u043e\u0442\u0438\u043a\u0430\u043c, \u043f\u0440\u043e\u0434\u0443\u043a\u0446\u0438\u044f \u0442\u043e\u043a\u0441\u0438\u043d\u043e\u0432 \u0438\u043b\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u0446\u0438\u043d\u043e\u0432","\u0436\u0438\u0432\u044b\u0445 \u043e\u0441\u043b\u0430\u0431\u043b\u0435\u043d\u043d\u044b\u0445 \u043c\u0438\u043a\u043e\u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439 \u0431\u044b\u0447\u044c\u0435\u0433\u043e \u0442\u0438\u043f\u0430"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0443\u044e \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u044e\u0442 \u043f\u043b\u0430\u0437\u043c\u0438\u0434\u044b \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439?","\u043a\u043e\u0434\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0434\u043e\u043f \u0441\u0432\u043e\u0439\u0441\u0442\u0432: \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c \u043a \u0430\u043d\u0442\u0438\u0431\u0438\u043e\u0442\u0438\u043a\u0430\u043c, \u043f\u0440\u043e\u0434\u0443\u043a\u0446\u0438\u044f \u0442\u043e\u043a\u0441\u0438\u043d\u043e\u0432 \u0438\u043b\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u0446\u0438\u043d\u043e\u0432","\u043f\u0440\u043e\u0432\u0435\u0434\u0435\u043d\u043d\u043e\u0439 \u043f\u043b\u0430\u043d\u043e\u0432\u043e\u0439 \u0432\u0430\u043a\u0446\u0438\u043d\u0430\u0446\u0438\u0435\u0439 \u0438\u043b\u0438 \u043f\u0435\u0440\u0435\u043d\u0435\u0441\u0435\u043d\u043d\u044b\u043c \u0431\u0435\u0441\u0441\u0438\u043c\u043f\u0442\u043e\u043c\u043d\u044b\u043c \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u043d\u043e\u0441\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e\u043c","\u043a\u0440\u043e\u0432\u044f\u043d\u043e\u0439 \u0430\u0433\u0430\u0440, \u0441\u0430\u0431\u0443\u0440\u043e, \u0427\u0430\u043f\u0435\u043a\u0430","\u043c\u0435\u043d\u0438\u043d\u0433\u043e\u043a\u043e\u043a\u043a"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u043c\u0435\u0445\u0430\u043d\u0438\u0437\u043c \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0438 \u043d\u0430\u0441\u043b\u0435\u0434\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u0438 \u0441 \u043f\u043e\u043c\u043e\u0449\u044c\u044e \u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0437\u043e\u043d\u043e\u0432?","\u0438\u0437 \u043e\u0434\u043d\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u0442\u043a\u0430 \u0414\u041d\u041a \u0432 \u0434\u0440\u0443\u0433\u043e\u0439","\u043a\u043e\u043c\u043c\u0435\u043d\u0441\u0430\u043b\u043e\u043c","\u043f\u0440\u043e\u043a\u0430\u0440\u0438\u043e\u0442\u044b, \u0440\u0430\u0437\u043c\u0435\u0440\u044b \u043c\u0435\u043b\u043a\u0438\u0435, \u0440\u0430\u0437\u043c\u043d\u043e\u0436\u0430.\u0442\u0441\u044f \u0434\u0435\u043b\u0435\u043d\u0438\u0435\u043c","\u0433\u0435\u043d\u043d\u0430\u044f \u0438\u043b\u0438 \u0442\u043e\u0447\u0435\u0447\u043d\u0430\u044f \u043c\u0443\u0442\u0430\u0446\u0438\u044f"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a \u043d\u0430\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u043e\u043d\u043d\u0430\u044f \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u0435\u043c\u043e\u0441\u0442\u044c \u0432 \u0435\u0434\u0438\u043d\u0438\u0447\u043d\u044b\u0445 \u0441\u043b\u0443\u0447\u0430\u044f\u0445?","\u0441\u043f\u043e\u0440\u0430\u0434\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u0435\u043c\u043e\u0441\u0442\u044c\u044e","\u043f\u0440\u043e\u043a\u0430\u0440\u0438\u043e\u0442\u044b, \u0440\u0430\u0437\u043c\u0435\u0440\u044b \u043c\u0435\u043b\u043a\u0438\u0435, \u0440\u0430\u0437\u043c\u043d\u043e\u0436\u0430.\u0442\u0441\u044f \u0434\u0435\u043b\u0435\u043d\u0438\u0435\u043c","\u0420\u0421\u041a- \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f","\u0441\u0440\u0435\u0434\u0430 \u0421\u0430\u0431\u0443\u0440\u043e"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u043e \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u043e \u0434\u043b\u044f \u043f\u0430\u0442\u043e\u0433\u0435\u043d\u043d\u044b\u0445 \u043c\u0438\u043a\u0440\u043e\u0431\u043e\u0432?","\u043f\u0430\u0442\u043e\u0433\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u0438 \u0432\u0438\u0440\u0443\u043b\u0435\u043d\u0442\u043d\u043e\u0441\u0442\u044c","\u0444\u0435\u043d\u043e\u0442\u0438\u043f\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430( \u043c\u043e\u0440\u0444\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u0435, \u043a\u0443\u043b\u044c\u0442\u0443\u0440\u0430\u043b\u044c\u043d\u044b\u0435 \u0438 \u0431\u0438\u043e\u0445\u0438\u043c)","\u0438\u0437 \u043e\u0434\u043d\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u0442\u043a\u0430 \u0414\u041d\u041a \u0432 \u0434\u0440\u0443\u0433\u043e\u0439","\u0433\u0435\u043d\u043d\u0430\u044f \u0438\u043b\u0438 \u0442\u043e\u0447\u0435\u0447\u043d\u0430\u044f \u043c\u0443\u0442\u0430\u0446\u0438\u044f"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0432\u0430 \u043f\u0440\u0438\u0440\u043e\u0434\u0430 \u0438 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430 \u044d\u043a\u0437\u043e\u0442\u043e\u043a\u0441\u0438\u043d\u043e\u0432?","\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0431\u0435\u043b\u043a\u0430\u0438\u043c\u0438, \u043e\u0431\u043b\u0430\u0434\u0430\u044e\u0442 \u0432\u044b\u0441\u043e\u043a\u043e\u0439 \u0442\u043e\u043a\u0441\u0438\u0447\u043d\u043e\u0441\u0442\u044c\u044e, \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u043d\u043e\u0441\u0442\u044c\u044e \u0438 \u0442\u0435\u0440\u043c\u043e\u043b\u0430\u0431\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c\u044e","\u0420\u0421\u041a- \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f","\u043f\u043d\u0435\u0432\u043c\u043e\u043a\u043e\u043a\u043a \u0438\u043b\u0438 \u0437\u0435\u043b\u0435\u043d\u044f\u0449\u0438\u0439 \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a","\u043a\u043e\u0434\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0434\u043e\u043f \u0441\u0432\u043e\u0439\u0441\u0442\u0432: \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c \u043a \u0430\u043d\u0442\u0438\u0431\u0438\u043e\u0442\u0438\u043a\u0430\u043c, \u043f\u0440\u043e\u0434\u0443\u043a\u0446\u0438\u044f \u0442\u043e\u043a\u0441\u0438\u043d\u043e\u0432 \u0438\u043b\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u0446\u0438\u043d\u043e\u0432"],["\u0423\u0437\u043d\u0430\u0439\u0442\u0435, \u043f\u0440\u0438 \u043a\u0430\u043a\u043e\u0439 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0438 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u043b\u0435\u0447\u0435\u0431\u043d\u0430\u044f \u0430\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430?","\u0434\u0438\u0444\u0442\u0435\u0440\u0438\u044f, \u0441\u0442\u043e\u043b\u0431\u043d\u044f\u043a, \u0431\u043e\u0442\u0443\u043b\u0438\u0437\u043c \u0438 \u0433\u0430\u0437\u043e\u0432\u0430\u044f \u0433\u0430\u043d\u0433\u0440\u0435\u043d\u0430","\u0441\u0440\u0435\u0434\u0430 \u0421\u0430\u0431\u0443\u0440\u043e","\u0434\u043b\u044f \u0444\u0430\u043b\u044c\u0441\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u0438 \u043e\u0431\u043d\u0430\u0440\u0443\u0436\u0435\u043d\u0438\u044f \u043f\u0440\u0438\u043c\u0435\u0441\u0435\u0439","\u0438\u0437 \u043e\u0434\u043d\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u0442\u043a\u0430 \u0414\u041d\u041a \u0432 \u0434\u0440\u0443\u0433\u043e\u0439"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0435 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u043e \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u043e \u0434\u043b\u044f \u044d\u043d\u0434\u043e\u0442\u043e\u043a\u0441\u0438\u043d\u043e\u0432?","\u0442\u0435\u0440\u043c\u043e\u0441\u0442\u0430\u0431\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c,","\u043c\u0435\u043d\u0438\u043d\u0433\u043e\u043a\u043e\u043a\u043a","\u0444\u0430\u0433\u043e\u0446\u0438\u0442\u0438\u0440\u0443\u044e\u0449\u0438\u0435 \u043a\u043b\u0435\u0442\u043a\u0438( \u043d\u0435\u0439\u0442\u0440\u043e\u0444\u0438\u043b\u044b \u0438 \u043c\u0430\u043a\u0440\u043e\u0444\u0430\u0433\u0438) \u0430 \u0442\u0430\u043a\u0436\u0435 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0435 \u043a\u0438\u043b\u043b\u0435\u0440\u044b (NK-\u043a\u043b\u0435\u0442\u043a\u0438)","\u0436\u0438\u0432\u044b\u0445 \u043e\u0441\u043b\u0430\u0431\u043b\u0435\u043d\u043d\u044b\u0445 \u043c\u0438\u043a\u043e\u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439 \u0431\u044b\u0447\u044c\u0435\u0433\u043e \u0442\u0438\u043f\u0430"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a \u043d\u0430\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u043c\u0438\u043a\u0440\u043e\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043f\u0440\u0438 \u0441\u043e\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043e\u0432\u0430\u043d\u0438\u0438 \u0441 \u043c\u0430\u043a\u0440\u043e\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u043e\u043c, \u043d\u0435 \u043d\u0430\u043d\u043e\u0441\u0438\u0442 \u0435\u043c\u0443 \u0432\u0440\u0435\u0434\u0430, \u043d\u043e \u0438 \u043d\u0435 \u043f\u0440\u0438\u043d\u043e\u0441\u0438\u0442 \u043f\u043e\u043b\u044c\u0437\u044b?","\u043a\u043e\u043c\u043c\u0435\u043d\u0441\u0430\u043b\u043e\u043c","\u0441\u0440\u0435\u0434\u0430 \u0421\u0430\u0431\u0443\u0440\u043e","\u043c\u0435\u043d\u0438\u043d\u0433\u043e\u043a\u043e\u043a\u043a","\u0434\u043b\u044f \u0444\u0430\u043b\u044c\u0441\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u0438 \u043e\u0431\u043d\u0430\u0440\u0443\u0436\u0435\u043d\u0438\u044f \u043f\u0440\u0438\u043c\u0435\u0441\u0435\u0439"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u043c\u0438\u043a\u0440\u043e\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u044b \u0430\u043a\u0442\u0438\u0432\u0438\u0437\u0438\u0440\u0443\u044e\u0442 \u0432\u044b\u0440\u043e\u0431\u043e\u0442\u043a\u0443 \u0438\u043d\u0442\u0435\u0440\u0444\u0435\u0440\u043e\u043d\u0430?","\u0432\u0438\u0440\u0443\u0441\u044b","\u043e\u0441\u0442\u0440\u0430\u044f \u0444\u0430\u0437\u0430 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u043e\u043d\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430","\u0444\u0435\u043d\u043e\u0442\u0438\u043f\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430( \u043c\u043e\u0440\u0444\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u0435, \u043a\u0443\u043b\u044c\u0442\u0443\u0440\u0430\u043b\u044c\u043d\u044b\u0435 \u0438 \u0431\u0438\u043e\u0445\u0438\u043c)","\u0432\u0438\u0440\u0443\u0441 \u0431\u0435\u0448\u0435\u043d\u0441\u0442\u0432\u0430"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u0430\u0433\u0435\u043d\u0442 \u043e\u0442\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u043a \u043d\u0435\u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u043c \u0444\u0430\u043a\u0442\u043e\u0440\u0430\u043c \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442\u0430?","\u0444\u0430\u0433\u043e\u0446\u0438\u0442\u0438\u0440\u0443\u044e\u0449\u0438\u0435 \u043a\u043b\u0435\u0442\u043a\u0438( \u043d\u0435\u0439\u0442\u0440\u043e\u0444\u0438\u043b\u044b \u0438 \u043c\u0430\u043a\u0440\u043e\u0444\u0430\u0433\u0438) \u0430 \u0442\u0430\u043a\u0436\u0435 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0435 \u043a\u0438\u043b\u043b\u0435\u0440\u044b (NK-\u043a\u043b\u0435\u0442\u043a\u0438)","\u043e\u0431\u043b\u0438\u0433\u0430\u0442\u043d\u044b\u0435 \u0432\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u0435 \u043f\u0430\u0440\u0430\u0437\u0438\u0442\u044b, \u043a\u0438\u0441\u043b\u043e\u0442\u043e\u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c, \u0440\u0430\u0441\u043f\u043e\u043b\u0430\u0433\u0430\u044e\u0442\u0441\u044f \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u043e","\u0441\u0440\u0435\u0434\u0430 \u0421\u0430\u0431\u0443\u0440\u043e","\u043e\u0441\u0442\u0440\u0430\u044f \u0444\u0430\u0437\u0430 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u043e\u043d\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u0432 \u043a\u0430\u043a\u0438\u0445 \u0431\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u0441\u0435\u043a\u0440\u0435\u0442\u0430\u0445 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u0442\u0441\u044f \u043b\u0438\u0437\u043e\u0446\u0438\u043c?","\u043a\u0440\u043e\u0432\u044c, \u0441\u043b\u0435\u0437\u0430,\u0441\u043b\u044e\u043d\u0430, \u0441\u0435\u043a\u0440\u0435\u0442\u044b \u0441\u043b\u0438\u0437\u0438\u0441\u0442\u044b\u0445 \u043e\u0431\u043e\u043b\u043e\u0447\u0435\u043a","\u0441\u0440\u0435\u0434\u0430 \u0421\u0430\u0431\u0443\u0440\u043e","\u043a\u0440\u043e\u0432\u044f\u043d\u043e\u0439 \u0430\u0433\u0430\u0440, \u0441\u0430\u0431\u0443\u0440\u043e, \u0427\u0430\u043f\u0435\u043a\u0430","\u0444\u0430\u0433\u043e\u0442\u0438\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435"],["\u0423 \u0440\u0435\u0431\u0435\u043d\u043a\u0430 \u0432\u044b\u0441\u043e\u043a\u0438\u0439 \u0442\u0438\u0442\u0440 \u0430\u043d\u0442\u0438\u0442\u0435\u043b IgG \u043a Corynebacterium diphteriae, \u043f\u0440\u0438 \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0438\u0438 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u043d\u0438\u044f \u0432 \u0430\u043d\u0430\u043c\u043d\u0435\u0437\u0435. \u041e\u0431\u044a\u044f\u0441\u043d\u0438\u0442\u0435, \u0447\u0435\u043c \u044d\u0442\u043e \u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c \u043e\u0431\u0443\u0441\u043b\u043e\u0432\u043b\u0435\u043d\u043e?","\u043f\u0440\u043e\u0432\u0435\u0434\u0435\u043d\u043d\u043e\u0439 \u043f\u043b\u0430\u043d\u043e\u0432\u043e\u0439 \u0432\u0430\u043a\u0446\u0438\u043d\u0430\u0446\u0438\u0435\u0439 \u0438\u043b\u0438 \u043f\u0435\u0440\u0435\u043d\u0435\u0441\u0435\u043d\u043d\u044b\u043c \u0431\u0435\u0441\u0441\u0438\u043c\u043f\u0442\u043e\u043c\u043d\u044b\u043c \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u043d\u043e\u0441\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e\u043c","\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0431\u0435\u043b\u043a\u0430\u0438\u043c\u0438, \u043e\u0431\u043b\u0430\u0434\u0430\u044e\u0442 \u0432\u044b\u0441\u043e\u043a\u043e\u0439 \u0442\u043e\u043a\u0441\u0438\u0447\u043d\u043e\u0441\u0442\u044c\u044e, \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u043d\u043e\u0441\u0442\u044c\u044e \u0438 \u0442\u0435\u0440\u043c\u043e\u043b\u0430\u0431\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c\u044e","\u0438\u043c\u043c\u0443\u043d\u043d\u043e\u0444\u0435\u0440\u043c\u0435\u043d\u0442\u043d\u044b\u0439 \u0430\u043d\u0430\u043b\u0438\u0437 \u0418\u0424\u0410","\u0433\u0435\u043d\u043d\u0430\u044f \u0438\u043b\u0438 \u0442\u043e\u0447\u0435\u0447\u043d\u0430\u044f \u043c\u0443\u0442\u0430\u0446\u0438\u044f"],["\u041f\u0440\u0438 \u0438\u0441\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438 \u043e\u0442\u0434\u0435\u043b\u044f\u0435\u043c\u043e\u0433\u043e \u043d\u043e\u0441\u043e\u0433\u043b\u043e\u0442\u043a\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u043c\u0435\u0442\u043e\u0434\u043e\u043c, \u043d\u0430 \u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043e\u0447\u043d\u043e\u043c \u0430\u0433\u0430\u0440\u0435 \u043f\u0440\u0438 \u0442\u0435\u043c\u043f\u0435\u0440\u0430\u0442\u0443\u0440\u0435 37\u00b0\u0421 \u0431\u044b\u043b \u0432\u044b\u044f\u0432\u043b\u0435\u043d \u0440\u043e\u0441\u0442 \u0413\u0440\u0430\u043c- \u0434\u0438\u043f\u043b\u043e\u043a\u043e\u043a\u043a\u043e\u0432 . \u0423\u0437\u043d\u0430\u0439\u0442\u0435 \u043f\u043e \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u044e, \u043e \u043a\u0430\u043a\u043e\u043c \u043c\u0438\u043a\u0440\u043e\u0431\u0435 \u0438\u0434\u0435\u0442 \u0440\u0435\u0447\u044c?","\u043c\u0435\u043d\u0438\u043d\u0433\u043e\u043a\u043e\u043a\u043a","\u0432\u0438\u0440\u0443\u0441\u044b","\u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u043f\u0435\u0440\u0441\u0438\u0441\u0442\u0435\u043d\u0446\u0438\u0435\u0439","\u0432\u0438\u0440\u0443\u0441 \u0433\u0435\u043f\u0430\u0442\u0438\u0442\u0430 \u0412"],["\u041f\u0440\u0438 \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0438 \u043c\u0438\u043a\u0440\u043e\u0431\u0430 \u0438\u0437 \u0433\u043d\u043e\u0439\u043d\u043e\u0433\u043e \u043e\u0442\u0434\u0435\u043b\u044f\u0435\u043c\u043e\u0433\u043e \u043d\u043e\u0441\u043e\u0433\u043b\u043e\u0442\u043a\u0438 \u043d\u0430 \u043a\u0440\u043e\u0432\u044f\u043d\u043e\u043c \u0430\u0433\u0430\u0440\u0435 \u0432\u043e\u043a\u0440\u0443\u0433 \u043a\u043e\u043b\u043e\u043d\u0438\u0439 \u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043b\u0430\u0441\u044c \u0437\u043e\u043d\u0430 \u0433\u0435\u043c\u043e\u043b\u0438\u0437\u0430 \u0441 \u0437\u0435\u043b\u0435\u043d\u044f\u0449\u0438\u043c \u043e\u0442\u0442\u0435\u043d\u043a\u043e\u043c, \u0430 \u0432 \u043c\u0430\u0437\u043a\u0430\u0445 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u044e\u0442\u0441\u044f \u043a\u043e\u0440\u043e\u0442\u043a\u0438\u0435 \u0446\u0435\u043f\u043e\u0447\u043a\u0438 \u0438\u0437 \u043a\u043e\u043a\u043a\u043e\u0432. \u0423\u0437\u043d\u0430\u0439\u0442\u0435 \u043f\u043e \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u044e, \u043e \u043a\u0430\u043a\u043e\u043c \u043c\u0438\u043a\u0440\u043e\u0431\u0435 \u0438\u0434\u0435\u0442 \u0440\u0435\u0447\u044c?","\u043f\u043d\u0435\u0432\u043c\u043e\u043a\u043e\u043a\u043a \u0438\u043b\u0438 \u0437\u0435\u043b\u0435\u043d\u044f\u0449\u0438\u0439 \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a","\u043c\u0435\u043d\u0438\u043d\u0433\u043e\u043a\u043e\u043a\u043a","\u0433\u0435\u043d\u043d\u0430\u044f \u0438\u043b\u0438 \u0442\u043e\u0447\u0435\u0447\u043d\u0430\u044f \u043c\u0443\u0442\u0430\u0446\u0438\u044f","\u0438\u0437 \u043e\u0434\u043d\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u0442\u043a\u0430 \u0414\u041d\u041a \u0432 \u0434\u0440\u0443\u0433\u043e\u0439"],["\u041f\u0440\u0438 \u0438\u0441\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438 \u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0438 \u043a\u0440\u043e\u0432\u0438 \u0432\u044b\u044f\u0432\u043b\u0435\u043d\u043e \u043f\u043e\u0432\u044b\u0448\u0435\u043d\u043d\u043e\u0435 \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u043d\u0438\u0435 \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u0438\u043c\u043c\u0443\u043d\u043e\u0433\u043b\u043e\u0431\u0443\u043b\u0438\u043d\u043e\u0432 Ig\u041c \u043a \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0435\u043d\u043d\u043e\u043c\u0443 \u043c\u0438\u043a\u0440\u043e\u0431\u0443. \u041e\u0431\u044a\u044f\u0441\u043d\u0438\u0442\u0435, \u043e \u0447\u0450\u043c \u044d\u0442\u043e \u043c\u043e\u0436\u0435\u0442 \u0441\u0432\u0438\u0434\u0435\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e\u0432\u0430\u0442\u044c?","\u043e\u0441\u0442\u0440\u0430\u044f \u0444\u0430\u0437\u0430 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u043e\u043d\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430","\u0441\u0430\u0445\u0430\u0440\u043d\u044b\u0439 \u0431\u0443\u043b\u044c\u043e\u043d, \u0441\u0440\u0435\u0434\u0430 \u043e\u0431\u0430\u0433\u0430\u0449\u0435\u043d\u043d\u044b\u0435 \u0443\u0433\u043b\u0435\u0432\u043e\u0434\u0430\u043c\u0438","\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0431\u0435\u043b\u043a\u0430\u0438\u043c\u0438, \u043e\u0431\u043b\u0430\u0434\u0430\u044e\u0442 \u0432\u044b\u0441\u043e\u043a\u043e\u0439 \u0442\u043e\u043a\u0441\u0438\u0447\u043d\u043e\u0441\u0442\u044c\u044e, \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u043d\u043e\u0441\u0442\u044c\u044e \u0438 \u0442\u0435\u0440\u043c\u043e\u043b\u0430\u0431\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c\u044e","\u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u0433\u0438\u0433\u0430\u043d\u0442\u0441\u043a\u0438\u0445 \u043c\u043d\u043e\u0433\u043e\u044f\u0434\u0435\u0440\u043d\u044b\u0445 \u043a\u043b\u0435\u0442\u043e\u043a \u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0435\u043c \u0430\u043d\u0442\u0438\u0433\u0435\u043d\u043e\u0432 \u0432\u043e\u0437\u0431\u0443\u0434\u0438\u0442\u0435\u043b\u044f \u0432 \u043d\u0438\u0445"],["\u0420\u0435\u0430\u043a\u0446\u0438\u044f \u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438 \u043c\u043e\u0436\u0435\u0442 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0442\u044c\u0441\u044f \u0432 \u0441\u0443\u0434\u0435\u0431\u043d\u043e\u0439 \u043c\u0435\u0434\u0438\u0446\u0438\u043d\u0435 \u0438 \u0441\u0430\u043d\u0438\u0442\u0430\u0440\u043d\u043e\u0439 \u043f\u0440\u0430\u043a\u0442\u0438\u043a\u0435. \u041e\u0431\u044a\u044f\u0441\u043d\u0438\u0442\u0435, \u0434\u043b\u044f \u0447\u0435\u0433\u043e \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438 \u0432 \u0441\u0430\u043d\u0438\u0442\u0430\u0440\u043d\u043e\u0439 \u043f\u0440\u0430\u043a\u0442\u0438\u043a\u0435?","\u0434\u043b\u044f \u0444\u0430\u043b\u044c\u0441\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u0438 \u043e\u0431\u043d\u0430\u0440\u0443\u0436\u0435\u043d\u0438\u044f \u043f\u0440\u0438\u043c\u0435\u0441\u0435\u0439","\u0432\u043e\u0437\u0431\u0443\u0434\u0438\u0442\u0435\u043b\u0438 \u0447\u0443\u043c\u044b Yersinia pertis","\u043c\u0435\u043d\u0438\u043d\u0433\u043e\u043a\u043e\u043a\u043a","\u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0442\u0435\u0440\u043c\u043e\u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438 \u043f\u043e \u0410\u0441\u043a\u043e\u043b\u0438"],["\u0412 \u0441\u0435\u0440\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0440\u0435\u0430\u043a\u0446\u0438\u0438, \u043c\u0438\u043a\u0440\u043e\u0431\u044b \u043f\u0440\u0438 \u0441\u043c\u0435\u0448\u0438\u0432\u0430\u043d\u0438\u0438 \u043e\u0441\u0430\u0436\u0434\u0430\u044e\u0442\u0441\u044f \u0441\u043e \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u043e\u0439 \u0438 \u043e\u0431\u0440\u0430\u0437\u0443\u044e\u0442 \u0432 \u0436\u0438\u0434\u043a\u043e\u0439 \u0441\u0440\u0435\u0434\u0435 \u043c\u0443\u0442\u043d\u043e\u0435 \u043a\u043e\u043b\u044c\u0446\u043e, \u0430 \u0432 \u0430\u0433\u0430\u0440\u0435 \u043f\u043e\u043b\u043e\u0441\u043a\u0438 . \u0423\u0437\u043d\u0430\u0439\u0442\u0435 \u043f\u043e \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u044e, \u043a\u0430\u043a \u043d\u0430\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u0441\u0435\u0440\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0440\u0435\u0430\u043a\u0446\u0438\u044f?","\u0440\u0435\u0430\u043a\u0446\u0438\u0435\u0439 \u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438","\u0441\u043f\u043e\u0440\u0430\u0434\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u0435\u043c\u043e\u0441\u0442\u044c\u044e","\u0440\u0438\u043a\u043a\u0435\u0442\u0441\u0438\u0438","\u043e\u0441\u0442\u0440\u0430\u044f \u0444\u0430\u0437\u0430 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u043e\u043d\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430"],["\u041f\u0440\u0438 \u043f\u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0435 \u0441\u0435\u0440\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0440\u0435\u0430\u043a\u0446\u0438\u0438 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u043e, \u0438 \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u043b\u0438\u0437\u0430 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439 \u0438 \u0433\u0435\u043c\u043e\u043b\u0438\u0437\u0430 \u044d\u0440\u0438\u0442\u0440\u043e\u0446\u0438\u0442\u043e\u0432 \u0431\u0430\u0440\u0430\u043d\u0430. \u0423\u0437\u043d\u0430\u0439\u0442\u0435 \u043f\u043e \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u044e, \u043e \u043a\u0430\u043a\u043e\u0439 \u0441\u0435\u0440\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0440\u0435\u0430\u043a\u0446\u0438\u0438 \u0438\u0434\u0435\u0442 \u0440\u0435\u0447\u044c?","\u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0441\u0432\u044f\u0437\u044b\u0432\u0430\u043d\u0438\u044f \u043a\u043e\u043c\u043f\u043b\u0435\u043c\u0435\u043d\u0442\u0430 \u0420\u0421\u041a","\u0434\u0438\u0444\u0442\u0435\u0440\u0438\u044f, \u0441\u0442\u043e\u043b\u0431\u043d\u044f\u043a, \u0431\u043e\u0442\u0443\u043b\u0438\u0437\u043c \u0438 \u0433\u0430\u0437\u043e\u0432\u0430\u044f \u0433\u0430\u043d\u0433\u0440\u0435\u043d\u0430","\u0444\u0430\u0433\u043e\u0442\u0438\u043f\u0438\u0440\u043e\u0432\u0430 \u043d\u044f\u044e\u0442\u0441\u044f \u0434\u043b\u044f \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u0440\u0430\u0437\u043b\u0438\u0447\u043d\u044b\u0445 \u043c\u0438\u043a\u0440\u043e\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u043e\u0432 \u0432 \u043b\u0430\u0431\u043e\u0440\u0430\u0442\u043e\u0440\u043d\u044b\u0445 \u0443\u0441\u043b\u043e\u0432\u0438\u044f\u0445. \u041f\u0440\u0435\u0434\u043f\u043e\u043b\u043e\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0435 \u0442\u0440\u0435\u0431\u043e\u0432\u0430\u043d\u0438\u0435 \u043a \u043d\u0438\u043c \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c\u043e \u043e\u0431\u0435\u0441\u043f\u0435\u0447\u0438\u0432\u0430\u0442\u044c \u0434\u043b\u044f \u0443\u0441\u043f\u0435\u0448\u043d\u043e\u0433\u043e \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u043c\u0438\u043a\u0440\u043e\u0431\u043e\u0432?","\u0441\u0442\u0435\u0440\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c, \u0438\u0437\u043e\u0442\u043e\u043d\u0438\u0447\u043d\u043e\u0441\u0442\u044c, \u043e\u043f\u0442 Ph,","\u0438\u0437 \u043e\u0434\u043d\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u0442\u043a\u0430 \u0414\u041d\u041a \u0432 \u0434\u0440\u0443\u0433\u043e\u0439","\u043e\u0441\u0442\u0440\u0430\u044f \u0444\u0430\u0437\u0430 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u043e\u043d\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430","\u043a\u0440\u043e\u0432\u044c, \u0441\u043b\u0435\u0437\u0430,\u0441\u043b\u044e\u043d\u0430, \u0441\u0435\u043a\u0440\u0435\u0442\u044b \u0441\u043b\u0438\u0437\u0438\u0441\u0442\u044b\u0445 \u043e\u0431\u043e\u043b\u043e\u0447\u0435\u043a"],["\u042d\u043f\u0438\u0434\u0435\u043c\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0435 \u043e\u0431\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0435 \u0432\u0441\u043f\u044b\u0448\u0435\u043a \u0441\u0442\u0430\u0444\u0438\u043b\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u044b\u0445 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u043d\u0438\u0439 \u043f\u0440\u043e\u0432\u043e\u0434\u044f\u0442 \u0434\u043b\u044f \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u044f \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u043e\u0432 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0438. \u0412\u044b\u0434\u0435\u043b\u0438\u0442\u0435 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0439 \u043c\u0435\u0442\u043e\u0434?","\u0444\u0430\u0433\u043e\u0442\u0438\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435","\u0440\u0435\u0430\u043a\u0446\u0438\u0435\u0439 \u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438","\u043a\u043b\u043e\u0441\u0442\u0440\u0438\u0434\u0438\u0438","\u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c \u043a \u0430\u043d\u0442\u0438\u0431\u0438\u043e\u0442\u0438\u043a\u0430\u043c, \u0441\u0438\u043d\u0442\u0435\u0437 \u0444\u0430\u043a\u0442\u043e\u0440\u043e\u0432 \u043f\u0430\u0442\u043e\u0433\u0435\u043d\u043d\u043e\u0441\u0442\u0438"],["\u041f\u0440\u0438 \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u0438\u0438 \u0433\u0435\u043c\u043e\u043b\u0438\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0441\u0438\u0441\u0442\u0435\u043c\u044b \u0432 \u043f\u0440\u043e\u0431\u0438\u0440\u043a\u0435 \u0441 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0441\u0438\u0441\u0442\u0435\u043c\u043e\u0439 \u0410\u043d\u0442\u0438\u0433\u0435\u043d+\u0410\u043d\u0442\u0438\u0442\u0435\u043b\u043e \u043f\u0440\u043e\u0438\u0437\u043e\u0448\u0435\u043b \u0433\u0435\u043c\u043e\u043b\u0438\u0437. \u0414\u0430\u0439\u0442\u0435 \u0438\u043d\u0442\u0435\u0440\u043f\u0440\u0435\u0442\u0430\u0446\u0438\u044e \u043e \u043a\u0430\u043a\u043e\u0439 \u0441\u0435\u0440\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0440\u0435\u0430\u043a\u0446\u0438\u0438 \u0438\u0434\u0435\u0442 \u0440\u0435\u0447\u044c?","\u0420\u0421\u041a- \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f","\u0432\u043e\u0437\u0431\u0443\u0434\u0438\u0442\u0435\u043b\u0438 \u0447\u0443\u043c\u044b Yersinia pertis","\u0440\u0438\u043a\u043a\u0435\u0442\u0441\u0438\u0438","\u0432\u0438\u0440\u0443\u0441 \u043f\u043e\u043b\u0438\u043e\u043c\u0438\u0435\u043b\u0438\u0442\u0430"],["\u0412 \u0438\u0441\u0441\u043b\u0435\u0434\u0443\u0435\u043c\u043e\u043c \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b\u0435 \u0431\u044b\u043b\u0438 \u043e\u0431\u043d\u0430\u0440\u0443\u0436\u0435\u043d\u044b \u0430\u043d\u0442\u0438\u0433\u0435\u043d\u044b \u0432\u043e\u0437\u0431\u0443\u0434\u0438\u0442\u0435\u043b\u044f \u0441\u0438\u0431\u0438\u0440\u0441\u043a\u043e\u0439 \u044f\u0437\u0432\u044b. \u041f\u0440\u0435\u0434\u043f\u043e\u043b\u043e\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0431\u044b\u043b\u0430 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d\u0430?","\u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0442\u0435\u0440\u043c\u043e\u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438 \u043f\u043e \u0410\u0441\u043a\u043e\u043b\u0438","\u0442\u0435\u0440\u043c\u043e\u0441\u0442\u0430\u0431\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c,","HBsAg, HBcAg, HBeAg","\u043a\u043b\u043e\u0441\u0442\u0440\u0438\u0434\u0438\u0438"],["\u041d\u0430 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u0441\u0440\u0435\u0434\u0435 \u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043b\u0438\u0441\u044c \u043a\u043e\u043b\u043e\u043d\u0438\u0438 \u0432\u0438\u0434\u0435 \"\u043a\u0440\u0443\u0436\u0435\u0432\u043d\u044b\u0445 \u043f\u043b\u0430\u0442\u043e\u0447\u043a\u043e\u0432\", \u043f\u0440\u0438 \u043c\u0438\u043a\u0440\u043e\u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043 434\u0438\u0438","\u043e\u0441\u0442\u0440\u0430\u044f \u0444\u0430\u0437\u0430 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u043e\u043d\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430","\u0440\u0438\u043a\u043a\u0435\u0442\u0441\u0438\u0438","\u0420\u0421\u041a- \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043e\u0442\u0440\u0438\u0446\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f"],["\u0422-\u043a\u0438\u043b\u043b\u0435\u0440\u044b \u0443\u043d\u0438\u0447\u0442\u043e\u0436\u0430\u044e\u0442 \u0447\u0443\u0436\u0435\u0440\u043e\u0434\u043d\u044b\u0435 \u043a\u043b\u0435\u0442\u043a\u0438. \u0418\u043d\u0442\u0435\u0440\u043f\u0440\u0435\u0442\u0438\u0440\u0443\u0439\u0442\u0435, \u043f\u0440\u0438 \u043a\u0430\u043a\u0438\u0445 \u0443\u0441\u043b\u043e\u0432\u0438\u044f\u0445 \u043f\u0440\u043e\u0438\u0441\u0445\u043e\u0434\u0438\u0442 \u0443\u043d\u0438\u0447\u0442\u043e\u0436\u0435\u043d\u0438\u0435 \u043a\u043b\u0435\u0442\u043e\u043a?","\u043f\u0440\u0438 \u0440\u0430\u0441\u043f\u043e\u0437\u043d\u0430\u0432\u0430\u043d\u0438\u0438 \u0438\u043c\u0438 \u043a\u043e\u043c\u043f\u043b\u0435\u043a\u0441\u0430 \u0430\u043d\u0442\u0438\u0433\u0435\u043d\u043d\u043e\u0433\u043e \u043f\u0435\u043f\u0442\u0438\u0434\u0430 \u0441 \u043c\u043e\u043b\u0435\u043a\u0443\u043b\u0430\u043c\u0438 \u041c\u041d\u0421 1 \u043a\u043b\u0430\u0441\u0441\u0430","\u043f\u0438\u043b\u0438,\u0444\u0438\u043c\u0431\u0440\u0438\u0438,\u0432\u043e\u0440\u0441\u0438\u043d\u043a\u0438","\u0440\u0438\u043a\u043a\u0435\u0442\u0441\u0438\u0438","\u0438\u043c\u043c\u0443\u043d\u043d\u043e\u0444\u0435\u0440\u043c\u0435\u043d\u0442\u043d\u044b\u0439 \u0430\u043d\u0430\u043b\u0438\u0437 \u0418\u0424\u0410"],["\u0414\u043b\u044f \u0433\u0435\u0440\u043f\u0435\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0439 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u043e \u0440\u0435\u0446\u0438\u0434\u0438\u0432\u0438\u0440\u043e\ 43b\u0430","\u0441\u0440\u0435\u0434\u0430 199, \u0441\u0440\u0435\u0434\u0430 \u0418\u0433\u043b\u0430"],["\u041f\u0440\u0438 \u0441\u043d\u044f\u0442\u0438\u0438 \u043f\u0435\u0442\u043b\u0435\u0439 \u0438\u0437\u043e\u043b\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0439 \u043a\u043e\u043b\u043e\u043d\u0438\u0438 \u0441 \u043c\u044f\u0441\u043e-\u043f\u0435\u043f\u0442\u043e\u043d\u043d\u043e\u0433\u043e \u0430\u0433\u0430\u0440\u0430 \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043e, \u0447\u0442\u043e \u043a\u043e\u043b\u043e\u043d\u0438\u044f \u0441\u043b\u0438\u0437\u0438\u0441\u0442\u0430\u044f, \u0442\u044f\u043d\u0435\u0442\u0441\u044f \u0437\u0430 \u043f\u0435\u0442\u043b\u0435\u0439. \u0423\u0437\u043d\u0430\u0439\u0442\u0435 \u043f\u043e \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u044e \u043e \u043a\u0430\u043a\u043e\u0439 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0435 \u0438\u0434\u0435\u0442 \u0440\u0435\u0447\u044c?","\u043a\u0430\u043f\u0441\u0443\u043b\u0430","\u0432\u0438\u0440\u0443\u0441 \u0433\u0435\u043f\u0430\u0442\u0438\u0442\u0430 \u0412","\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u0430\u044f \u0441\u0442\u0435\u043d\u043a\u0430-\u043e\u043a\u0440\u0430\u0441\u043a\u0430 \u043f\u043e \u0433\u0440\u0430\u043c\u0443, \u043a\u0430\u043f\u0441\u0443\u043b\u0430-\u043f\u043e \u0431\u0443\u0440\u0440\u0438 \u0433\u0438\u043d\u0441\u0443, \u0441\u043f\u043e\u0440\u044b-\u043f\u043e \u0430\u0443\u044d\u0441\u043a\u0438, \u0436\u0433\u0443\u0442\u0438\u043a\u0438-\u0441\u0435\u0440\u0435\u0431 \u043f\u043e \u043c\u043e\u0440\u043e\u0437\u043e\u0432\u0443, \u0437\u0435\u0440\u043d\u0430 \u0432\u043e\u043b-\u043f\u043e \u043d\u0435\u0439\u0441\u0441\u0435\u0440\u0443","\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u0443\u044e \u0441\u0442\u0435\u043d\u043a\u0443"],["\u0423 \u043a\u043b\u0435\u0442\u043e\u0447\u043d\u043e\u0439 \u0441\u0442\u0435\u043d\u043a\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439 \u0438\u043c\u0435\u0435\u0442\u0441\u044f \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0430, \u043a\u043e\u0442\u043e\u0440\u0430\u044f \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u0435\u0442 \u0441\u043f\u043e\u0441\u043e\u0431\u043d\u043e\u0441\u0442\u044c \u043f\u0440\u0438\u043a\u0440\u0435\u043f\u043b\u044f\u0442\u044c\u0441\u044f \u043a \u043f\u043e\u0432\u0435\u0440\u0445\u043d\u043e\u0441\u0442\u0438 \u043a\u043b\u0435\u0442\u043e\u043a. \u041f\u0440\u0435\u0434\u0441\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u044d\u0442\u043e \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0430?","\u043f\u0438\u043b\u0438,\u0444\u0438\u043c\u0431\u0440\u0438\u0438,\u0432\u043e\u0440\u0441\u0438\u043d\u043a\u0438","\u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0442\u0435\u0440\u043c\u043e\u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438 \u043f\u043e \u0410\u0441\u043a\u043e\u043b\u0438","\u0438\u043c\u043c\u0443\u043d\u043d\u043e\u0444\u0435\u0440\u043c\u0435\u043d\u0442\u043d\u044b\u0439 \u0430\u043d\u0430\u043b\u0438\u0437 \u0418\u0424\u0410","\u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u043f\u0435\u0440\u0441\u0438\u0441\u0442\u0435\u043d\u0446\u0438\u0435\u0439"],["\u041f\u0440\u0438 \u0438\u0437\u0443\u0447\u0435\u043d\u0438\u0438 \u043c\u0438\u043a\u0440\u043e\u0441\u043a\u043e\u043f\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u043c\u0435\u0442\u043e\u0434\u043e\u043c \u0438\u0441\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u044f \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043b\u0438 \u0441\u043b\u043e\u0436\u043d\u044b\u0439 \u043c\u0435\u0442\u043e\u0434 \u043e\u043a\u0440\u0430\u0441\u043a\u0438. \u0420\u0430\u0437\u043b\u0438\u0447\u0438\u0442\u0435, \u043a\u0430\u043a\u0443\u044e \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0443 \u0438\u0437\u0443\u0447\u0430\u044e\u0442 \u0441 \u043f\u043e\u043c\u043e\u0449\u044c\u044e \u0434\u0430\u043d\u043d\u043e\u0433\u043e \u0
