 поставить при такой картине мазка?", "гонорея"], ["У ребенка афтозный стоматит на слизистой полости рта, выраженный белый налет. О каком возбудителе можно вести речь в данном случае?", "candida albicans (кандидоз)"], ["Больная 18 лет, поступила в больницу в связи с тем, что мать заметила у дочери желтуху. Никаких других симптомов болезни не отмечает. Самочувствие хорошее. Раньше желтухой не болела. Никаких парентеральных вмешательств в течение полгода не было. Отмечается легкая желтушность склер и кожи, печень у края реберной дуги, чувствительная при пальпации и перкуссии. Какой серологический макер подтверждает этиологию вирусного гепатита в данном случае?", "Anti-HAV IgM"], ["Больной 46 лет, оперирован в начале октября 2011 г. по поводу язвенной болезни 12ти-перстной кишки. До и после операции переливалась кровь, всего перелито 1300 мл. В контакте с желтушными больными не был. 28.11.11 г. появились боли в суставах, слабость, пропал аппетит. 30.11.11 г. потемнела моча, со 2.12.11 г. заметил желтушность кожи, склер, в тот же день поступил в больницу с диагнозом: Вирусный гепатит. При поступлении: вялый, адинамичный, плохой аппетит, выраженная желтуха, рвота 1-2 раза в день. Печень +2,0 см, болезненна, селезенка не увеличена. Определите какой вирусный гепатит наиболее вероятен?", "гепатит В"], ["После укуса блох во время похода в горы появился увеличенный лимфатический узел (бубон) в области шеи, о какой инфекции может идти речь?", "бубонная форма чумы (yersinia pestis)"], ["Пациент поступил в инфекционное отделение с симптомами артрита коленного сустава. При тестировании сыворотки крови с помощью реакции Райта был выявлен высокий титр антител (1:800) к антигену В.melitensis. О какой инфекции идет речь?", "b.melitensis бруцеллез"], ["У фермера на пальцах рук появились язвочки, которые покрылись струпом черного цвета. Появилась температура, недомогание. О какой инфекции идет речь?", "кожная форма сибирской язвы"], ["У больного кашель с гнойной мокротой, при микроскопии и окраске методом Циля-Нильсена были выявлены палочки рубиново-красного цвета. О каком заболевании может идти речь?", "туберкулез"], ["Больной 32 года, не женат. Страдает гемофилией, ежегодно получает внутривенно препараты крови. За последние два года имел половые контакты с шестью мужчинами, один из которых был в африканской стране 12 месяцев назад в служебной командировке. Результат иммуно-ферментного анализа крови на ВИЧ – был дважды положительный при постановке с интервалом 3 месяца. Какой метод диагностики может быть в дальнейшем применен для окончательной постановки диагноза?", "иммуноблоттинг"], ["В деревне зафиксирована вспышка сибирской язвы среди людей, контактировавших с заражёнными животными. Какой основной путь передачи этого заболевания?", "контактный  путь"], ["В гостиницу был вызван врач к больному, два дня назад вернувшемуся из поездки по Индии. Свое заболевание больной связывает с употреблением днем пирожков с творогом. Ночью у него появился жидкий, водянистый стул. К утру дефекации участились, стул стал более обильным и приобрел вид рисового отвара. Дважды была рвота. О какой инфекции в данном случае может идти речь?", "vibtio cholerae"], ["В аэропорту выявлен пассажир с лихорадкой, сильной слабостью, кровотечениями из носа и десен. Он недавно вернулся из Африки. Какая инфекция наиболее вероятна?", "лихорадка Эбола и Марбург( вирусные геморрагические лихорадки)"], ["В населенном пункте выявлены случаи бубонной чумы. Каким путём чаще всего передаётся эта инфекция?", "трансмиссивный путь"], ["В лабораторию поступили пробы почвы из местности, где скот заболел сибирской язвой. Какие бактерии могут быть обнаружены?", "bacillus anthracis"], ["В регионе зарегистрированы случаи холеры. Какой основной механизм развития болезни?", "гиперсекреция воды и ионов хлора и натрия в прочвет кишечника, вызывач профузную водянистую диарею"], ["В инфекционную больницу поступил пациент с высокой лихорадкой, воспалёнными лимфоузлами (бубонами) и общим тяжёлым состоянием. Он недавно контактировал с грызунами. Какой метод диагностики будет наиболее информативным на ранних стадиях заболевания?", "бактериоскопия, бактериологияеский и ПЦР"], ["У Больного с подозрением на бубонную чуму был исследован пунктат из бубона, при микроскопическом исследовании материала были обнаружены грам-отрицательные палочки биполярно окрашенные. Какой дополнительный метод диагностики можно использовать для окончательного подтверждения диагноза.", "ПЦР, иммунофлюоресценция, бактериологический"], ["В лабораторию доставлен биологический материал от пациента с подозрением на чуму. Какой метод диагностики позволит наиболее быстро подтвердить возбудителя?", "ПЦР"], ["У пациента с длительной лихорадкой, потливостью и болями в суставах заподозрен бруцеллёз. Какой метод лабораторной диагностики наиболее специфичен на ранних стадиях заболевания?", "ПЦР, серологический"], ["У пациента с подозрением на эндемический возвратный тиф обнаружены IgM к Borrelia duttoni. Что это значит?", "острая стадия заболевания"]]},

nes"], ["В лабораторию поступил материал –слизь с миндалин от больного ангиной, которую необходимо посеять на кровяной агар. Объясните, какой фактор вирулентности определяется на этой среде?", "гемолитическая активность"], ["В лабораторию от больного брюшным тифом поступила кровь. Необходимо поставить реакцию агглютинацию. Выделите, какие ингредиенты будут использованы для ее постановки?", "сыворотка крови больного и диагностикум"], ["Из раневого отделяемого выделена чистая культура Clostridium perfringens. Приготовлены мазки. Различите, какие методы окраски будете использовать для выявления и окраски спор?", "по Ожешке или по Пешкову"], ["В лабораторию поступил материал (слизь с миндалин и носа) от больного с подозрением на дифтерию. Предположите, какие методы окраски вы примените для обнаружения волютиновых зерен возбудителя дифтерии?", "метод Нейссера"], ["Изменчивость вируса гриппа связана с изменением подтипов в результате дрейфа и шифта, приводящее к возникновению новых эпидемий. Различите, антигены вируса гриппа, с которыми это связано?", "гемагглютинин и нейраминидаза"], ["Больной жалуется на повышение температуры, насморк, кашель. На коже и слизистых оболочках гемморагическая сыпь, конъюктивит, на слизистой оболочке щек пятна Филатова- Коплика. Интерпретируйте, какая эта инфекция?", "корь"], ["В лабораторию поступил материал (кровь) от больного с предварительным диагнозом «Гепатит В». Выделите, какие реакции необходимо поставить для подтверждения диагноза?", "ИФА, РНГА, ПЦР"], ["Вирусам герпеса характерна персистенция в различных органах. Объясните, где чаще всего встречается это явление?", "в нейронах чувствительных ганглиев"], ["На территории стран Африканского континента имеются карантинные инфекции, против которых необходимо обязательная вакцинация перед, въездом в страну. Объясните, при какой карантинной инфекции необходимая обязательная вакцинация?", "желтая лихорадка"], ["У годовалого ребенка повышенное содержание специфических иммуноглобулинов IgG к ано?", "острой фазе инфекционного процесса"], ["В некоторых случаях заражение человека взвесью холерных вибрионов происходит, но заболевание не развивается. Интерпретируйте, с чем это может быть связано?", "врожденного иммунитета"], ["У человека и животных имеется невосприимчивость по отношению к определенным видам инфекций. Объясните, с наличием какого иммунитета это связано?", "видового врожденного иммунитета"], ["Dosis Letalis Minima является единицей измерения свойств микробного токсина, объясните о каком патогенном свойстве идет речь?", "вирулентности"], ["Человек заражается инфекционными заболеваниями через кровососущих насекомыми. Объясните, каким путем происходит заражение?", "трансмиссивный путь"], ["Некоторые микробы обладают способностью к формированию устойчивости к антибиотикам из β-лактамной группы. Объясните, с каким механизмом это связано?", "В-лактамаз"], ["Механизм антибактериального действия антибиотиков β-лактамной группы связан с нарушением синтеза определенной структуры микроба. Объясните, с повреждением какой структуры это связано?", "пептидогликана клеточной стенки"], ["Бактериям свойствена высокая мутационная способность. Объясните, в чем заключается главная особенность мутационной изменчивости у микробов?", "быстрой селекцией"], ["Бактериофаги участвуют передаче информации между бактериями при генетических рекомбинаций. . Объясните, в каких механизмах могут участвовать бактериофаги?", "трансдукции"], ["Бактериофаги широко применяются в медицине для диагностики , лечения и профилактики заболеваний. Объясните, при каком методе диагностики они применяются?", "фаготипирования"], ["Спорообразующие микробы при росте на питательных средах могут образовывать споры. Объясните, с чем это связано?", "с неблагоприятными условиями среды"], ["Микробам свойственна изменчивость, когда микробы одной популяции могут разделяться и менять свои морфологические, биохимические свойства и форму колоний. Объясните, как называется этот феномен?", "диссоциация"], ["П лой. Узнайте по описанию, какая это бактерия ?", "менингококк"]]}
];
var sub=0,n=10,qs=[],ci=0,sc=0,wr=[];

function go(id){
  document.querySelectorAll('.sc').forEach(function(s){s.classList.remove('on')});
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}
function sel(i){sub=i;document.getElementById('cfg-h').textContent=D[i].name;go('s1')}
function setN(b,v){
  document.querySelectorAll('.cnt-btn').forEach(function(x){x.classList.remove('sel')});
  b.classList.add('sel');n=v;
}
function shuffle(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}
  return b;
}
function startQuiz(){
  var pool=shuffle(D[sub].data);
  qs=pool.slice(0,Math.min(n,pool.length));
  ci=0;sc=0;wr=[];go('s2');showQ();
}
function showQ(){
  var q=qs[ci],tot=qs.length;
  var tag=document.getElementById('q-tag');
  tag.textContent=D[sub].tag;tag.className='tag '+D[sub].cls;
  document.getElementById('q-cnt').textContent=(ci+1)+' / '+tot;
  document.getElementById('q-fill').style.width=(ci/tot*100)+'%';
  document.getElementById('q-txt').textContent=q[0];
  var fb=document.getElementById('q-fb');
  fb.style.display='none';fb.className='fb';
  var nb=document.getElementById('nxt');nb.style.display='none';
  var pool=D[sub].data;
  var wrong=shuffle(pool.filter(function(x){return x[1]!==q[1]})).slice(0,3).map(function(x){return x[1]});
  var opts=shuffle([q[1]].concat(wrong));
  var c=document.getElementById('q-opts');c.innerHTML='';
  opts.forEach(function(o){
    var b=document.createElement('button');
    b.className='abtn';
    b.textContent=o.length>130?o.slice(0,130)+'…':o;
    (function(opt){b.addEventListener('click',function(){answer(opt,q[1])})})(o);
    c.appendChild(b);
  });
}
function answer(chosen,correct){
  var btns=document.querySelectorAll('.abtn');
  btns.forEach(function(b){
    b.classList.add('dis');
    var t=b.textContent;
    if(t===correct||(correct.length>130&&correct.indexOf(t.slice(0,-1))===0)){
      b.classList.add('show');
    }
  });
  var ok=chosen===correct||(correct.length>130&&correct.indexOf(chosen.slice(0,-1))===0);
  var fb=document.getElementById('q-fb');fb.style.display='block';
  if(ok){
    sc++;
    btns.forEach(function(b){if(b.textContent===chosen)b.classList.add('ok')});
    fb.className='fb ok';fb.textContent='✓ Верно!';
  } else {
    btns.forEach(function(b){if(b.textContent===chosen)b.classList.add('bad')});
    fb.className='fb bad';
    fb.innerHTML='✗ Неверно.<br><strong>Правильный ответ:</strong> '+correct;
    wr.push({q:qs[ci][0],a:correct,ch:chosen});
  }
  var nb=document.getElementById('nxt');nb.style.display='block';
  nb.textContent=ci<qs.length-1?'Следующий вопрос →':'Смотреть результат →';
}
function next(){
  ci++;
  if(ci>=qs.length){
    var t=qs.length,pct=Math.round(sc/t*100);
    document.getElementById('r-n').textContent=sc;
    document.getElementById('r-of').textContent='из '+t;
    var msg=pct>=80?'Отлично 🎉':pct>=60?'Хорошо 👍':'Нужно повторить 💪';
    document.getElementById('r-pct').textContent=pct+'% — '+msg;
    go('s3');
  } else {showQ()}
}
function showReview(){
  go('s4');
  var l=document.getElementById('rev-list');
  if(wr.length===0){
    l.innerHTML='<p style="color:#8e8e93;font-size:14px;padding:8px 0">Ошибок нет — отличный результат!</p>';
    return;
  }
  l.innerHTML=wr.map(function(w){
    return '<div class="ri">'
      +'<div class="ri-q">'+w.q+'</div>'
      +'<div class="ri-a">✓ '+w.a+'</div>'
      +'<div class="ri-w">✗ '+w.ch+'</div>'
      +'</div>';
  }).join('');
}
</script>
