0440\u0435\u0430\u043a\u0446\u0438\u044f \u0442\u0435\u0440\u043c\u043e\u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438 \u043f\u043e \u0410\u0441\u043a\u043e\u043b\u0438","\u0441\u0440\u0435\u0434\u0430 199, \u0441\u0440\u0435\u0434\u0430 \u0418\u0433\u043b\u0430"],["\u041f\u0440\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u043c \u0438\u0441\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438 \u0434\u0438\u0444\u0442\u0435\u0440\u0438\u0438 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u0440\u0435\u0430\u043a\u0446\u0438\u044f \u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438. \u0418\u043d\u0442\u0435\u0440\u043f\u0440\u0435\u0442\u0438\u0440\u0443\u0439\u0442\u0435, \u0434\u043b\u044f \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0435\u043d\u0438\u044f \u043a\u0430\u043a\u0438\u0445 \u0441\u0432\u043e\u0439\u0441\u0442\u0432 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u044d\u0442\u0430 \u0440\u0435\u0430\u043a\u0446\u0438\u044f?","\u0442\u043e\u043a\u0441\u0438\u0433\u0435\u043d\u043d\u043e\u0441\u0442\u0438","\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u0443\u044e \u0441\u0442\u0435\u043d\u043a\u0443","\u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430 \u043a\u0440\u043e\u0432\u0438","\u0440\u0438\u043a\u043a\u0435\u0442\u0441\u0438\u0438"],["\u0412 \u043c\u0438\u043a\u0440\u043e\u0431\u0438\u043e\u043b\u043e\u0433\u0438\u0438 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u044e\u0442 \u0440\u0430\u0437\u043b\u0438\u0447\u043d\u044b\u0435 \u043a\u043b\u0438\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0438\u0441\u0441\u043b\u0435\u0434\u0443\u0435\u043c\u044b\u0435 \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b\u044b \u0434\u043b\u044f \u0434\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u043a\u0438 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u043e\u043d\u043d\u044b\u0445 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u043d\u0438\u0439. \u041f\u0440\u0435\u0434\u0441\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u0438\u0441\u0441\u043b\u0435\u0434\u0443\u0435\u043c\u044b\u0439 \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c \u0434\u043b\u044f \u0441\u0435\u0440\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0434\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u043a\u0438?","\u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430 \u043a\u0440\u043e\u0432\u0438","\u0444\u0430\u0433\u043e\u0442\u0438\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435","\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u0443\u044e \u0441\u0442\u0435\u043d\u043a\u0443","\u0441\u0442\u0435\u0440\u0438\u043b\u0438\u0437\u0430\u0446\u0438\u044f(\u0430\u0432\u0442\u043e\u043a\u043b\u0430\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435, \u0441\u0443\u0445\u043e\u0439 \u0436\u0430\u0440)"],["\u041f\u0440\u0438 \u0438\u0441\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438 \u0431\u043e\u043b\u044c\u043d\u044b\u0445 \u0441\u0438\u0431\u0438\u0440\u0441\u043a\u043e\u0439 \u044f\u0437\u0432\u043e\u0439 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u044e\u0442 \u044d\u043a\u0441\u043f\u0440\u0435\u0441\u0441 \u2013 \u043c\u0435\u0442\u043e\u0434 \u0434\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u043a\u0438. \u041f\u0440\u0435\u0434\u043f\u043e\u043b\u043e\u0436\u0438\u0442\u0435, \u043e \u043a\u0430\u043a\u043e\u043c \u043c\u0435\u0442\u043e\u0434\u0435 \u0438\u0434\u0435\u0442 \u0440\u0435\u0447\u044c?","\u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0442\u0435\u0440\u043c\u043e\u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438 \u043f\u043e \u0410\u0441\u043a\u043e\u043b\u0438","\u0440\u043e\u0434 \u042d\u0448\u0435\u0440\u0438\u0445\u0438\u0438 Escherichia","\u0441\u0442\u0435\u0440\u0438\u043b\u0438\u0437\u0430\u0446\u0438\u044f(\u0430\u0432\u0442\u043e\u043a\u043b\u0430\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435, \u0441\u0443\u0445\u043e\u0439 \u0436\u0430\u0440)","\u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430 \u043a\u0440\u043e\u0432\u0438"],["\u041f\u0440\u0438 \u0441\u0435\u0440\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u043a\u043e\u043c \u0438\u0441\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043b\u0438 \u0438\u043d\u0433\u0440\u0435\u0434\u0438\u0435\u043d\u0442\u044b \u201c\u0430\u043d\u0442\u0438\u0433\u0435\u043d, \u0430\u043d\u0442\u0438\u0442\u0435\u043b\u043e, \u0444\u0438\u0437\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0440\u0430\u0441\u0442\u0432\u043e\u0440\u201d , \u043f\u043e\u0441\u043b\u0435 \u0438\u043d\u043a\u0443\u0431\u0430\u0446\u0438\u0438 \u0432 \u0442\u0435\u0440\u043c\u043e\u0441\u0442\u0430\u0442\u0435 \u0432 \u043f\u0440\u043e\u0431\u0438\u0440\u043a\u0435 \u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043b\u0438\u0441\u044c \u0445\u043b\u043e\u043f\u044c\u044f. \u0418\u043d\u0442\u0435\u0440\u043f\u0440\u0435\u0442\u0438\u0440\u0443\u0439\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u044d\u0442\u043e \u0440\u0435\u0430\u043a\u0446\u0438\u044f?","\u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0430\u0433\u0433\u043b\u044e\u0442\u0438\u043d\u0430\u0446\u0438\u0438","\u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0442\u0435\u0440\u043c\u043e\u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438 \u043f\u043e \u0410\u0441\u043a\u043e\u043b\u0438","\u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430 \u043a\u0440\u043e\u0432\u0438","\u0431\u0430\u0446\u0438\u043b\u043b\u044b \u0438 \u043a\u043b\u043e\u0441\u0442\u0440\u0438\u0434\u0438\u0438"],["\u041f\u0440\u0438 \u0434\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u043a\u0435 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u043e\u043d\u043d\u043e\u0433\u043e \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u043d\u0438\u044f \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043e, \u0447\u0442\u043e \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u043e\u043c \u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0432\u043d\u0443\u0442\u0440\u0438\u0431\u043e\u043b\u044c\u043d\u0438\u0447\u043d\u044b\u0439 \u0448\u0442\u0430\u043c\u043c \u0441\u0442\u0430\u0444\u0438\u043b\u043e\u043a\u043e\u043a\u043a\u043e\u0432. \u0412\u044b\u0434\u0435\u043b\u0438\u0442\u0435, \u0441 \u043f\u043e\u043c\u043e\u0449\u044c\u044e \u043a\u0430\u043a\u043e\u0433\u043e \u043c\u0435\u0442\u043e\u0434\u0430 \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d \u0434\u0438\u0430\u0433\u043d\u043e\u0437?","\u0444\u0430\u0433\u043e\u0442\u0438\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435","\u0442\u043e\u043a\u0441\u0438\u0433\u0435\u043d\u043d\u043e\u0441\u0442\u0438","\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u0443\u044e \u0441\u0442\u0435\u043d\u043a\u0443","\u0438\u043d\u0442\u0435\u0433\u0440\u0430\u0442\u0438\u0432\u043d\u044b\u0439 \u0442\u0438\u043f \u0440\u0435\u043f\u0440\u043e\u0434\u0443\u043a\u0446\u0438\u0438"],["\u041f\u0440\u0438 \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0438 \u0432\u0438\u0440\u0443\u0441\u043e\u0432 \u043d\u0430 \u043a\u0443\u0440\u0438\u043d\u043e\u043c \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0435 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u044e\u0442\u0441\u044f \u043c\u0435\u0442\u043e\u0434\u044b \u0438\u043d\u0434\u0438\u043a\u0430\u0446\u0438\u0438. \u041f\u0440\u0435\u0434\u043f\u043e\u043b\u043e\u0436\u0438\u0442\u0435, \u043e \u043a\u0430\u043a\u043e\u043c \u043c\u0435\u0442\u043e\u0434\u0435 \u0438\u0434\u0435\u0442 \u0440\u0435\u0447\u044c?","\u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0433\u0435\u043c\u0430\u0433\u0433\u043b\u044e\u0442\u0438\u043d\u0430\u0446\u0438\u0438","\u043a\u0430\u043f\u0441\u0443\u043b\u0430","\u0443\u0441\u043b\u043e\u0432\u043d\u043e-\u043f\u0430\u0442\u043e\u0433\u0435\u043d\u043d\u044b\u0435 \u043c\u0438\u043a\u0440\u043e\u0431\u044b","\u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0438"],["\u041f\u043e\u0434 \u043f\u043e\u043d\u044f\u0442\u0438\u0435\u043c \u0432\u0438\u0440\u043e\u0433\u0435\u043d\u0438\u044f, \u043f\u043e\u0434\u0440\u0430\u0437\u0443\u043c\u0435\u0432\u0430\u0435\u0442\u0441\u044f \u0432\u0437\u0430\u0438\u043c\u043e\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435 \u0432\u0438\u0440\u0443\u0441\u0430 \u0441 \u043a\u043b\u0435\u0442\u043a\u043e\u0439 \u0445\u043e\u0437\u044f\u0438\u043d\u0430. \u0418\u043d\u0442\u0435\u0440\u043f\u0440\u0435\u0442\u0438\u0440\u0443\u0439\u0442\u0435 \u0442\u0438\u043f \u0440\u0435\u043f\u0440\u043e\u0434\u0443\u043a\u0446\u0438\u0438?","\u0438\u043d\u0442\u0435\u0433\u0440\u0430\u0442\u0438\u0432\u043d\u044b\u0439 \u0442\u0438\u043f \u0440\u0435\u043f\u0440\u043e\u0434\u0443\u043a\u0446\u0438\u0438","\u0438\u043c\u043c\u0443\u043d\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u043f\u0430\u043c\u044f\u0442\u044c","\u0437\u043e\u043b\u043e\u0442\u0438\u0441\u0442\u044b\u0439 \u0441\u0442\u0430\u0444\u0438\u043b\u043e\u043a\u043e\u043a\u043a Staphylococcus aureus","\u0440\u0435\u0430\u043a\u0446\u0438\u044f \u0442\u0435\u0440\u043c\u043e\u043f\u0440\u0435\u0446\u0438\u043f\u0438\u0442\u0430\u0446\u0438\u0438 \u043f\u043e \u0410\u0441\u043a\u043e\u043b\u0438"]];
var n=10,qs=[],ci=0,sc=0,wr=[];

function go(id){document.querySelectorAll('.sc').forEach(function(s){s.classList.remove('on')});document.getElementById(id).classList.add('on');window.scrollTo(0,0)}
function setN(b,v){document.querySelectorAll('.cnt-btn').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');n=v}
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b}

function startQ(){
  var count=n===0?D.length:Math.min(n,D.length);
  qs=shuf(D.slice()).slice(0,count);
  ci=0;sc=0;wr=[];go('s2');showQ();
}

function showQ(){
  var q=qs[ci],tot=qs.length;
  document.getElementById('qcnt').textContent=(ci+1)+' / '+tot;
  document.getElementById('qfill').style.width=(ci/tot*100)+'%';
  document.getElementById('qtx').textContent=q[0];
  var fb=document.getElementById('qfb');fb.style.display='none';fb.className='fb';
  document.getElementById('nxt').style.display='none';
  // q = [вопрос, правильный, дистр1, дистр2, дистр3]
  var correct=q[1];
  var opts=shuf([correct,q[2],q[3],q[4]]);
  var c=document.getElementById('qopts');c.innerHTML='';
  opts.forEach(function(o){
    var b=document.createElement('button');
    b.className='abtn';
    b.textContent=o;
    b.addEventListener('click',(function(opt){return function(){answer(opt,correct)}})(o));
    c.appendChild(b);
  });
}

function answer(chosen,correct){
  document.querySelectorAll('.abtn').forEach(function(b){
    b.classList.add('dis');
    if(b.textContent===correct){b.classList.add('show')}
  });
  var ok=chosen===correct;
  var fb=document.getElementById('qfb');fb.style.display='block';
  if(ok){
    sc++;
    document.querySelectorAll('.abtn').forEach(function(b){if(b.textContent===chosen)b.classList.add('ok')});
    fb.className='fb ok';fb.textContent='✓ Верно!';
  } else {
    document.querySelectorAll('.abtn').forEach(function(b){if(b.textContent===chosen)b.classList.add('bad')});
    fb.className='fb bad';
    fb.innerHTML='✗ Неверно. Правильный ответ: <strong>'+correct+'</strong>';
    wr.push({q:qs[ci][0],a:correct,ch:chosen});
  }
  var nb=document.getElementById('nxt');nb.style.display='block';
  nb.textContent=ci<qs.length-1?'Следующий →':'Результат →';
}

function nxt(){
  ci++;
  if(ci>=qs.length){
    var t=qs.length,pct=Math.round(sc/t*100);
    document.getElementById('rsn').textContent=sc;
    document.getElementById('rsof').textContent='из '+t;
    var msg=pct>=80?'Отлично':pct>=60?'Хорошо':'Нужно повторить';
    document.getElementById('rpct').textContent=pct+'% — '+msg;
    go('s3');
  } else {showQ()}
}

function showRev(){
  go('s4');
  var l=document.getElementById('rvl');
  if(!wr.length){l.innerHTML='<p style="color:#8e8e93;padding:8px 0">Ошибок нет!</p>';return}
  l.innerHTML=wr.map(function(w){
    return '<div class="ri"><div class="ri-q">'+w.q+'</div>'
      +'<div class="ri-a">✓ '+w.a+'</div>'
      +'<div class="ri-w">✗ '+w.ch+'</div></div>'
  }).join('');
}
</script>
</body></html>
