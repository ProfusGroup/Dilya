<script>
var D=[["\u0423\u0437\u043d\u0430\u0439\u0442\u0435 ,\u0447\u0442\u043e \u043e\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043b\u044f\u044e\u0442 \u0422-\u044d\u0444\u0444\u0435\u043a\u0442\u043e\u0440\u044b (\u043a\u0438\u043b\u043b\u0435\u0440\u044b)?","\u041e\u0442\u0442\u043e\u0440\u0436\u0435\u043d\u0438\u0435 \u0442\u0440\u0430\u043d\u0441\u043f\u043b\u0430\u043d\u0442\u0430\u0442\u0430","\u0413\u043e\u043d\u043e\u043a\u043e\u043a\u043a\u0438","207.\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0438 \u0432\u044b\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u043a\u043e\u043a\u043a\u0430\u043c\u0438? \u041e\u0442\u0432\u0435\u0442: \u041f\u043d\u0435\u0432\u043c\u043e\u043d\u0438\u0438","\u041e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u043a\u0430\u043f\u0441\u0443\u043b\u044b"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u0447\u0442\u043e \u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0444\u0443\u043d\u043a\u0446\u0438\u0435\u0439 \u043f\u043b\u0430\u0437\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043a\u043b\u0435\u0442\u043e\u043a?","\u0421\u0438\u043d\u0442\u0435\u0437 \u0438\u043c\u043c\u0443\u043d\u043e\u0433\u043b\u043e\u0431\u0443\u043b\u0438\u043d\u043e\u0432","\u041d\u0435\u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044b\u0439 \u0444\u0430\u0433\u043e\u0446\u0438\u0442\u043e\u0437","\u041d\u0430\u043b\u0438\u0447\u0438\u0435\u043c \u0432\u044b\u0440\u0430\u0436\u0435\u043d\u043d\u043e\u0433\u043e \u043b\u0430\u0442\u0435\u043d\u0442\u043d\u043e\u0433\u043e \u043f\u0435\u0440\u0438\u043e\u0434\u0430 \u0434\u043e 5 \u0434\u043d\u0435\u0439","\u0412\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u043c \u0440\u0430\u0441\u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435\u043c"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u0447\u0435\u043c \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u0438\u0437\u0443\u0435\u0442\u0441\u044f \u043f\u0435\u0440\u0432\u0438\u0447\u043d\u044b\u0439 \u0438\u043c\u043c\u0443\u043d\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442?","\u041d\u0430\u043b\u0438\u0447\u0438\u0435\u043c \u0432\u044b\u0440\u0430\u0436\u0435\u043d\u043d\u043e\u0433\u043e \u043b\u0430\u0442\u0435\u043d\u0442\u043d\u043e\u0433\u043e \u043f\u0435\u0440\u0438\u043e\u0434\u0430 \u0434\u043e 5 \u0434\u043d\u0435\u0439","\u0413\u0435\u043c\u043e\u043b\u0438\u0437 \u044d\u0440\u0438\u0442\u0440\u043e\u0446\u0438\u0442\u043e\u0432","\u041f\u0440\u043e\u0445\u043e\u0434\u044f\u0442 \u0447\u0435\u0440\u0435\u0437 \u043f\u043b\u0430\u0446\u0435\u043d\u0442\u0443","\u0413\u0435\u043c\u043e\u043b\u0438\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u043c"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u043c\u0438 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430\u043c\u0438 \u043e\u0431\u043b\u0430\u0434\u0430\u044e\u0442 \u0438\u043c\u043c\u0443\u043d\u043e\u0433\u043b\u043e\u0431\u0443\u043b\u0438\u043d\u0430 IgG?","\u041f\u0440\u043e\u0445\u043e\u0434\u044f\u0442 \u0447\u0435\u0440\u0435\u0437 \u043f\u043b\u0430\u0446\u0435\u043d\u0442\u0443","\u0413\u043e\u043d\u043e\u043a\u043e\u043a\u043a\u0438","\u041d\u0435\u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044b\u0439 \u0444\u0430\u0433\u043e\u0446\u0438\u0442\u043e\u0437","\u041e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u043a\u0430\u043f\u0441\u0443\u043b\u044b"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u044b \u0434\u043b\u044f \u0438\u043c\u043c\u0443\u043d\u043e\u0433\u043b\u043e\u0431\u0443\u043b\u0438\u043d\u0430 IgM?","\u041c\u0430\u043a\u0440\u043e\u043c\u043e\u043b\u0435\u043a\u0443\u043b\u044f\u0440\u043d\u043e\u0435 \u0441\u0442\u0440\u043e\u0435\u043d\u0438\u0435","\u0421\u043a\u0430\u0440\u043b\u0430\u0442\u0438\u043d\u0443, \u0440\u043e\u0436\u0443, \u0440\u0435\u0432\u043c\u0430\u0442\u0438\u0437\u043c.","\u0412\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u043c \u0440\u0430\u0441\u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435\u043c","\u041f\u043b\u0430\u0437\u043c\u043e\u043a\u043e\u0430\u0433\u0443\u043b\u0430\u0437\u044b"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u044b \u0434\u043b\u044f \u0438\u043c\u043c\u0443\u043d\u043e\u0433\u043b\u043e\u0431\u0443\u043b\u0438\u043d\u0430 Ig\u0410?","\u0424\u043e\u0440\u043c\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u043c\u0435\u0441\u0442\u043d\u043e\u0433\u043e \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442\u0430","\u0413\u0435\u043c\u043e\u043b\u0438\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u043c","\u0417\u0430\u0440\u0430\u0436\u0435\u043d\u0438\u0435\u043c \u043a\u0443\u0440\u0438\u043d\u043e\u0433\u043e \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430","\u0413\u043e\u043d\u043e\u043a\u043e\u043a\u043a\u0438"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430 \u0438\u043c\u043c\u0443\u043d\u043e\u0433\u043b\u043e\u0431\u0443\u043b\u0438\u043d\u0430 Ig\u0415?","207.\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0438 \u0432\u044b\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u043a\u043e\u043a\u043a\u0430\u043c\u0438? \u041e\u0442\u0432\u0435\u0442: \u041f\u043d\u0435\u0432\u043c\u043e\u043d\u0438\u0438","\u0424\u0430\u0433\u043e\u0442\u0438\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435","\u0417\u0430\u0440\u0430\u0436\u0435\u043d\u0438\u0435\u043c \u043a\u0443\u0440\u0438\u043d\u043e\u0433\u043e \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430","\u0421\u0438\u043d\u0442\u0435\u0437 \u0438\u043c\u043c\u0443\u043d\u043e\u0433\u043b\u043e\u0431\u0443\u043b\u0438\u043d\u043e\u0432"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043e\u0442 \u0447\u0435\u0433\u043e \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u0434\u043e\u0441\u0442\u043e\u0432\u0435\u0440\u043d\u043e\u0441\u0442\u044c \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u0438\u0441\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u044f \u043f\u0440\u0438 \u0432\u0437\u044f\u0442\u0438\u0438 \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b\u0430?","\u0414\u043e \u043d\u0430\u0447\u0430\u043b\u0430 \u0430\u043d\u0442\u0438\u043c\u0438\u043a\u0440\u043e\u0431\u043d\u043e\u0439 \u0442\u0435\u0440\u0430\u043f\u0438\u0438","\u041f\u043b\u0430\u0437\u043c\u043e\u043a\u043e\u0430\u0433\u0443\u043b\u0430\u0437\u044b","\u041e\u0442\u0442\u043e\u0440\u0436\u0435\u043d\u0438\u0435 \u0442\u0440\u0430\u043d\u0441\u043f\u043b\u0430\u043d\u0442\u0430\u0442\u0430","\u0413\u0435\u043c\u043e\u043b\u0438\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u043c"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u0444\u0430\u043a\u0442\u043e\u0440 \u043f\u0430\u0442\u043e\u0433\u0435\u043d\u043d\u043e\u0441\u0442\u0438 \u0441\u0442\u0430\u0444\u0438\u043b\u043e\u043a\u043e\u043a\u043a\u0430 \u043e\u0431\u0443\u0441\u043b\u043e\u0432\u043b\u0438\u0432\u0430\u0435\u0442 \u043f\u0443\u0437\u044b\u0440\u0447\u0430\u0442\u043a\u0443 \u043d\u043e\u0432\u043e\u0440\u043e\u0436\u0434\u0435\u043d\u043d\u044b\u0445?","\u042d\u043a\u0441\u0444\u043e\u043b\u0438\u0430\u0442\u0438\u043d","\u0421\u043a\u0430\u0440\u043b\u0430\u0442\u0438\u043d\u0443, \u0440\u043e\u0436\u0443, \u0440\u0435\u0432\u043c\u0430\u0442\u0438\u0437\u043c.","\u042d\u0440\u0438\u0442\u0440\u043e\u0433\u0435\u043d\u0438\u043d","\u041c\u043e\u043a\u0440\u043e\u0442\u0430"],["\u041f\u0435\u0440\u0435\u0447\u0438\u0441\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u043d\u0438\u044f \u0432\u044b\u0437\u044b\u0432\u0430\u044e\u0442\u0441\u044f \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u0430\u043c\u0438?","\u0421\u043a\u0430\u0440\u043b\u0430\u0442\u0438\u043d\u0443, \u0440\u043e\u0436\u0443, \u0440\u0435\u0432\u043c\u0430\u0442\u0438\u0437\u043c.","\u041d\u0430\u043b\u0438\u0447\u0438\u0435\u043c \u0432\u044b\u0440\u0430\u0436\u0435\u043d\u043d\u043e\u0433\u043e \u043b\u0430\u0442\u0435\u043d\u0442\u043d\u043e\u0433\u043e \u043f\u0435\u0440\u0438\u043e\u0434\u0430 \u0434\u043e 5 \u0434\u043d\u0435\u0439","\u041c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u043b\u0435\u043a\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c\u044e","\u0412\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u043c \u0440\u0430\u0441\u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435\u043c"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043f\u043e \u043a\u0430\u043a\u0438\u043c \u043f\u0440\u0438\u0437\u043d\u0430\u043a\u0430\u043c \u043e\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0432\u0438\u0434\u043e\u0432\u0430\u044f \u0434\u0438\u0444\u0444\u0435\u0440\u0435\u043d\u0446\u0438\u0430\u0446\u0438\u044f \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u043e\u0432 ?","\u0413\u0435\u043c\u043e\u043b\u0438\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u043c","\u0424\u0430\u0433\u043e\u0442\u0438\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435","\u041f\u0440\u043e\u0445\u043e\u0434\u044f\u0442 \u0447\u0435\u0440\u0435\u0437 \u043f\u043b\u0430\u0446\u0435\u043d\u0442\u0443","\u041c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u043b\u0435\u043a\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c\u044e"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u0447\u0442\u043e \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u044e\u0442 \u0434\u043b\u044f \u0438\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u043e\u0432 \u043f\u043e \u0430\u043d\u0442\u0438\u0433\u0435\u043d\u043d\u043e\u0439 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0435 ?","\u0413\u0435\u043c\u043e\u043b\u0438\u0437 \u044d\u0440\u0438\u0442\u0440\u043e\u0446\u0438\u0442\u043e\u0432","\u041f\u0440\u043e\u0445\u043e\u0434\u044f\u0442 \u0447\u0435\u0440\u0435\u0437 \u043f\u043b\u0430\u0446\u0435\u043d\u0442\u0443","\u042d\u043a\u0441\u0444\u043e\u043b\u0438\u0430\u0442\u0438\u043d","\u041c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u043b\u0435\u043a\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c\u044e"],["\u0423\u0437\u043d\u0430\u0439\u0442\u0435, \u0447\u0442\u043e \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c\u043e \u0434\u043b\u044f \u043f\u0440\u0435\u0434\u0443\u043f\u0440\u0435\u0436\u0434\u0435\u043d\u0438\u044f \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u044f \u043e\u0441\u043b\u043e\u0436\u043d\u0435\u043d\u0438\u0439 \u043f\u0440\u0438 \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u044b\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u044f\u0445?","\u041f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e\u0435 \u043b\u0435\u0447\u0435\u043d\u0438\u0435 \u043e\u0441\u0442\u0440\u044b\u0445 \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u044b\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0439","\u0410\u043d\u0430\u0442\u043e\u043a\u0441\u0438\u043d","\u041c\u043e\u043a\u0440\u043e\u0442\u0430","\u0413\u043e\u043d\u043e\u043a\u043e\u043a\u043a\u0438"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u0447\u0442\u043e \u043e\u0431\u0443\u0441\u043b\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442 \u043f\u043e\u044f\u0432\u043b\u0435\u043d\u0438\u0435 \u043a\u043e\u0436\u043d\u043e\u0439 \u0441\u044b\u043f\u0438 \u043f\u0440\u0438 \u0441\u043a\u0430\u0440\u043b\u0430\u0442\u0438\u043d\u0435?","\u042d\u0440\u0438\u0442\u0440\u043e\u0433\u0435\u043d\u0438\u043d","\u041c\u0430\u043a\u0440\u043e\u043c\u043e\u043b\u0435\u043a\u0443\u043b\u044f\u0440\u043d\u043e\u0435 \u0441\u0442\u0440\u043e\u0435\u043d\u0438\u0435","\u0416\u0435\u043b\u0442\u043e\u0447\u043d\u043e-\u0441\u043e\u043b\u0435\u0432\u043e\u0439 \u0430\u0433\u0430\u0440","\u0413\u0435\u043c\u043e\u043b\u0438\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u043c"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u043d\u0438\u044f \u0432\u043e\u0437\u043d\u0438\u043a\u0430\u044e\u0442 \u043f\u043e\u0441\u043b\u0435 \u043e\u0441\u0442\u0440\u044b\u0445 \u0430\u043d\u0433\u0438\u043d, \u0432\u044b\u0437\u0432\u0430\u043d\u043d\u044b\u0445 \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u0430\u043c\u0438 \u0433\u0440\u0443\u043f\u043f\u044b \u0410?","\u0420\u0435\u0432\u043c\u0430\u0442\u0438\u0437\u043c","\u041c\u0430\u043a\u0440\u043e\u043c\u043e\u043b\u0435\u043a\u0443\u043b\u044f\u0440\u043d\u043e\u0435 \u0441\u0442\u0440\u043e\u0435\u043d\u0438\u0435","\u0417\u0430\u0440\u0430\u0436\u0435\u043d\u0438\u0435\u043c \u043a\u0443\u0440\u0438\u043d\u043e\u0433\u043e \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430","\u0413\u043e\u043d\u043e\u043a\u043e\u043a\u043a\u0438"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u0432 \u0447\u0435\u043c \u043e\u0441\u043e\u0431\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u043f\u043d\u0435\u0432\u043c\u043e\u043a\u043e\u043a\u043a\u043e\u0432?","\u041e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u043a\u0430\u043f\u0441\u0443\u043b\u044b","\u0413\u0435\u043c\u043e\u043b\u0438\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u043c","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0438\u0439","207.\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0438 \u0432\u044b\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u043a\u043e\u043a\u043a\u0430\u043c\u0438? \u041e\u0442\u0432\u0435\u0442: \u041f\u043d\u0435\u0432\u043c\u043e\u043d\u0438\u0438"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u0438\u0441\u0441\u043b\u0435\u0434\u0443\u0435\u043c\u044b\u0439 \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u043f\u0440\u0438 \u043f\u043d\u0435\u0432\u043c\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u044b\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u044f\u0445?","\u041c\u043e\u043a\u0440\u043e\u0442\u0430","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0438\u0439","\u0424\u0430\u0433\u043e\u0442\u0438\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u0447\u0435\u043c \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u0438\u0437\u0443\u044e\u0442\u0441\u044f \u043c\u0435\u043d\u0438\u043d\u0433\u043e\u043a\u043e\u043a\u043a\u0438 ?","\u0412\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u043c \u0440\u0430\u0441\u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435\u043c","\u041c\u0430\u043a\u0440\u043e\u043c\u043e\u043b\u0435\u043a\u0443\u043b\u044f\u0440\u043d\u043e\u0435 \u0441\u0442\u0440\u043e\u0435\u043d\u0438\u0435","\u0424\u0430\u0433\u043e\u0442\u0438\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u043c\u0430\u0442\u0435\u0440\u0438\u0430\u043b \u0438\u0441\u0441\u043b\u0435\u0434\u0443\u044e\u0442 \u043f\u0440\u0438 \u0434\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u043a\u0435 \u043c\u0435\u043d\u0438\u043d\u0433\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u043e\u0439 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0438?","\u041b\u0438\u043a\u0432\u043e\u0440","\u041f\u0440\u043e\u0445\u043e\u0434\u044f\u0442 \u0447\u0435\u0440\u0435\u0437 \u043f\u043b\u0430\u0446\u0435\u043d\u0442\u0443","\u041e\u0442\u0442\u043e\u0440\u0436\u0435\u043d\u0438\u0435 \u0442\u0440\u0430\u043d\u0441\u043f\u043b\u0430\u043d\u0442\u0430\u0442\u0430","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0438\u0439"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u043c\u0438\u043a\u0440\u043e\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u044b \u0438\u043d\u0444\u0438\u0446\u0438\u0440\u0443\u044e\u0442 \u043f\u043b\u043e\u0434 \u043f\u0440\u0438 \u043f\u0440\u043e\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u0438 \u0447\u0435\u0440\u0435\u0437 \u0440\u043e\u0434\u043e\u0432\u044b\u0435 \u043f\u0443\u0442\u0438 \u0431\u043e\u043b\u044c\u043d\u043e\u0439 \u043c\u0430\u0442\u0435\u0440\u0438?","\u0413\u043e\u043d\u043e\u043a\u043e\u043a\u043a\u0438","\u042d\u0440\u0438\u0442\u0440\u043e\u0433\u0435\u043d\u0438\u043d","\u0423\u0431\u0438\u0442\u0430\u044f \u0432\u0430\u043a\u0446\u0438\u043d\u0430","\u041f\u0440\u043e\u0445\u043e\u0434\u044f\u0442 \u0447\u0435\u0440\u0435\u0437 \u043f\u043b\u0430\u0446\u0435\u043d\u0442\u0443"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u0447\u0442\u043e \u0438\u043c\u0435\u0435\u0442 \u0434\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435 \u043f\u0440\u0438 \u0433\u043e\u043d\u043e\u0440\u0435\u0435?","\u041d\u0435\u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044b\u0439 \u0444\u0430\u0433\u043e\u0446\u0438\u0442\u043e\u0437","\u041f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e\u0435 \u043b\u0435\u0447\u0435\u043d\u0438\u0435 \u043e\u0441\u0442\u0440\u044b\u0445 \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u044b\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0439","\u0421\u0440\u0435\u0434\u0430 \u041b\u0435\u0432\u0435\u043d\u0448\u0442\u0435\u0439\u043d\u0430-\u0418\u0435\u043d\u0441\u0435\u043d\u0430","\u0423\u0431\u0438\u0442\u0430\u044f \u0432\u0430\u043a\u0446\u0438\u043d\u0430"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a \u0438\u0437\u0443\u0447\u0430\u044e\u0442 \u0431\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430 \u0445\u043b\u0430\u043c\u0438\u0434\u0438\u0439?","\u0417\u0430\u0440\u0430\u0436\u0435\u043d\u0438\u0435\u043c \u043a\u0443\u0440\u0438\u043d\u043e\u0433\u043e \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430","\u0412\u044b\u044f\u0432\u043b\u0435\u043d\u0438\u0438 \u043a\u043e\u0440\u0434-\u0444\u0430\u043a\u0442\u043e\u0440\u0430","\u041f\u043b\u0430\u0437\u043c\u043e\u043a\u043e\u0430\u0433\u0443\u043b\u0430\u0437\u044b","\u0425\u0430\u0440\u0430\u043a\u0442\u0435\u0440 \u043a\u043e\u043b\u043e\u043d\u0438\u0439 \u043d\u0430 \u0442\u0432\u0435\u0440\u0434\u043e\u0439 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u0441\u0440\u0435\u0434\u0435"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u0447\u0442\u043e \u0438\u043c\u0435\u0435\u0442 \u0434\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435 \u043f\u0440\u0438 \u0438\u0441\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438 \u043c\u0438\u043a\u043e\u043f\u043b\u0430\u0437\u043c\u0435\u043d\u043d\u043e\u0433\u043e \u0443\u0440\u0435\u0442\u0440\u0438\u0442\u0430?","\u0425\u0430\u0440\u0430\u043a\u0442\u0435\u0440 \u043a\u043e\u043b\u043e\u043d\u0438\u0439 \u043d\u0430 \u0442\u0432\u0435\u0440\u0434\u043e\u0439 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u0441\u0440\u0435\u0434\u0435","\u041f\u043b\u0430\u0437\u043c\u043e\u043a\u043e\u0430\u0433\u0443\u043b\u0430\u0437\u044b","\u041d\u0435\u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044b\u0439 \u0444\u0430\u0433\u043e\u0446\u0438\u0442\u043e\u0437","\u0421\u0440\u0435\u0434\u0430 \u041b\u0435\u0432\u0435\u043d\u0448\u0442\u0435\u0439\u043d\u0430-\u0418\u0435\u043d\u0441\u0435\u043d\u0430"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043d\u0430\u043b\u0438\u0447\u0438\u0435\u043c \u0447\u0435\u0433\u043e \u043e\u0431\u0443\u0441\u043b\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u043f\u0430\u0442\u043e\u0433\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u0441\u0442\u0430\u0444\u0438\u043b\u043e\u043a\u043e\u043a\u043a\u043e\u0432?","\u041f\u043b\u0430\u0437\u043c\u043e\u043a\u043e\u0430\u0433\u0443\u043b\u0430\u0437\u044b","\u041f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e\u0435 \u043b\u0435\u0447\u0435\u043d\u0438\u0435 \u043e\u0441\u0442\u0440\u044b\u0445 \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u044b\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0439","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0438\u0439","\u042d\u043a\u0441\u0444\u043e\u043b\u0438\u0430\u0442\u0438\u043d"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435 , \u043a\u0430\u043a\u0438\u0435 \u0441\u0440\u0435\u0434\u044b \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u0434\u043b\u044f \u0432\u044b\u0434\u0435\u043b\u0435\u043d\u0438\u044f \u0441\u0442\u0430\u0444\u0438\u043b\u043e\u043a\u043e\u043a\u043a\u043e\u0432 \u0438\u0437 \u0433\u043d\u043e\u044f, \u044d\u043a\u0441\u0441\u0443\u0434\u0430\u0442\u0430, \u043c\u043e\u043a\u0440\u043e\u0442\u044b?","\u0416\u0435\u043b\u0442\u043e\u0447\u043d\u043e-\u0441\u043e\u043b\u0435\u0432\u043e\u0439 \u0430\u0433\u0430\u0440","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0438\u0439","\u041a\u0430\u0437\u0435\u0438\u043d\u043e\u0432\u043e-\u0443\u0433\u043e\u043b\u044c\u043d\u044b\u0439 \u0430\u0433\u0430\u0440","\u041f\u043b\u0430\u0437\u043c\u043e\u043a\u043e\u0430\u0433\u0443\u043b\u0430\u0437\u044b"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u0447\u0442\u043e \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u044f\u0442 \u0434\u043b\u044f \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u044f \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u0430 \u0432\u043d\u0443\u0442\u0440\u0438\u0431\u043e\u043b\u044c\u043d\u0438\u0447\u043d\u043e\u0439 \u0441\u0442\u0430\u0444\u0438\u043b\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u043e\u0439 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0438?","\u0424\u0430\u0433\u043e\u0442\u0438\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435","\u0410\u043d\u0430\u0442\u043e\u043a\u0441\u0438\u043d","\u0412\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u043c \u0440\u0430\u0441\u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435\u043c","\u041b\u0438\u043a\u0432\u043e\u0440"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u0447\u0435\u043c \u043e\u0442\u043b\u0438\u0447\u0430\u044e\u0442\u0441\u044f \u0432\u043d\u0443\u0442\u0440\u0438\u0431\u043e\u043b\u044c\u043d\u0438\u0447\u043d\u044b\u0435 \u0448\u0442\u0430\u043c\u043c\u044b \u0441\u0442\u0430\u0444\u0438\u043b\u043e\u043a\u043e\u043a\u043a\u043e\u0432?","\u041c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u043b\u0435\u043a\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c\u044e","\u041d\u0435\u043a\u0438\u0441\u043b\u043e\u0442\u043e\u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u044b\u0439","\u041b\u0438\u043a\u0432\u043e\u0440","\u0413\u043e\u043d\u043e\u043a\u043e\u043a\u043a\u0438"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u043f\u0440\u0435\u043f\u0430\u0440\u0430\u0442\u044b \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u044e\u0442 \u0434\u043b\u044f \u0438\u043c\u043c\u0443\u043d\u043e\u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u0441\u0442\u0430\u0444\u0438\u043b\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u044b\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0439?","\u0410\u043d\u0430\u0442\u043e\u043a\u0441\u0438\u043d","\u0414\u043e \u043d\u0430\u0447\u0430\u043b\u0430 \u0430\u043d\u0442\u0438\u043c\u0438\u043a\u0440\u043e\u0431\u043d\u043e\u0439 \u0442\u0435\u0440\u0430\u043f\u0438\u0438","\u041f\u043b\u0430\u0437\u043c\u043e\u043a\u043e\u0430\u0433\u0443\u043b\u0430\u0437\u044b","\u0416\u0435\u043b\u0442\u043e\u0447\u043d\u043e-\u0441\u043e\u043b\u0435\u0432\u043e\u0439 \u0430\u0433\u0430\u0440"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0441\u0440\u0435\u0434\u0430 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u043f\u0440\u0438 \u0434\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u043a\u0435 \u0434\u0438\u0444\u0442\u0435\u0440\u0438\u0438?","\u041a\u0440\u043e\u0432\u044f\u043d\u043e-\u0442\u0435\u043b\u043b\u0443\u0440\u0438\u0442\u043e\u0432\u0430\u044f","\u0410\u043d\u0430\u0442\u043e\u043a\u0441\u0438\u043d","\u0412 \u0432\u0438\u0434\u0435 \u043f\u0430\u0447\u0435\u043a \u0441\u0438\u0433\u0430\u0440","\u0411\u043e\u043b\u044c\u043d\u044b\u0435 \u043e\u0442\u043a\u0440\u044b\u0442\u043e\u0439 \u0444\u043e\u0440\u043c\u043e\u0439 \u0442\u0443\u0431\u0435\u0440\u043a\u0443\u043b\u0435\u0437\u0430"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442 \u0444\u043e\u0440\u043c\u0438\u0440\u0443\u0435\u0442\u0441\u044f \u043f\u0440\u0438 \u0434\u0438\u0444\u0442\u0435\u0440\u0438\u0438?","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0438\u0439","\u0423\u0431\u0438\u0442\u0430\u044f \u0432\u0430\u043a\u0446\u0438\u043d\u0430","\u041e\u0431\u043d\u0430\u0440\u0443\u0436\u0435\u043d\u0438\u0438 \u0434\u0440\u0443\u0437 \u0432 \u043c\u0430\u0437\u043a\u0430\u0445 \u0438\u0437 \u0433\u043d\u043e\u044f","\u041f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e\u0435 \u043b\u0435\u0447\u0435\u043d\u0438\u0435 \u043e\u0441\u0442\u0440\u044b\u0445 \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u044b\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0439"],["\u0423\u0437\u043d\u0430\u0439\u0442\u0435, \u0447\u0442\u043e \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0434\u043b\u044f \u043f\u0430\u0441\u0441\u0438\u0432\u043d\u043e\u0439 \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u0434\u0438\u0444\u0442\u0435\u0440\u0438\u0438?","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430","\u041f\u0438\u043a\u043e\u0440\u043d\u0430\u0432\u0438\u0440\u0443\u0441\u043e\u0432","\u0424\u0435\u0440\u043c\u0435\u043d\u0442\u0438\u0440\u0443\u044e\u0442 \u043b\u0430\u043a\u0442\u043e\u0437\u0443.","\u041f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e\u0435 \u043b\u0435\u0447\u0435\u043d\u0438\u0435 \u043e\u0441\u0442\u0440\u044b\u0445 \u0441\u0442\u0440\u0435\u043f\u0442\u043e\u043a\u043e\u043a\u043a\u043e\u0432\u044b\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0439"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0432\u0430\u043a\u0446\u0438\u043d\u0430 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0434\u043b\u044f \u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u0434\u0438\u0444\u0442\u0435\u0440\u0438\u0438?","\u0410\u043d\u0430\u0442\u043e\u043a\u0441\u0438\u043d","\u042d\u0448\u0435\u0440\u0438\u0445\u0438\u0438","\u0412\u044b\u044f\u0432\u043b\u0435\u043d\u0438\u0438 \u043a\u043e\u0440\u0434-\u0444\u0430\u043a\u0442\u043e\u0440\u0430","\u0411\u0426\u0416"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u043a\u0443\u043b\u044c\u0442\u0443\u0440\u0430\u043b\u044c\u043d\u044b\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u044b \u0434\u043b\u044f \u043f\u0430\u043b\u043e\u0447\u0435\u043a \u043a\u043e\u043a\u043b\u044e\u0448\u0430?","\u041a\u043e\u043b\u043e\u043d\u0438\u0438 \u0432 \u0432\u0438\u0434\u0435 \"\u043a\u0430\u043f\u0435\u043b\u0435\u043a \u0440\u0442\u0443\u0442\u0438\"","\u0413\u043b\u043e\u0442\u043a\u0438 \u0438 \u043a\u0438\u0448\u0435\u0447\u043d\u0438\u043a\u0430","\u041a\u0440\u043e\u0432\u044f\u043d\u043e-\u0442\u0435\u043b\u043b\u0443\u0440\u0438\u0442\u043e\u0432\u0430\u044f","\u042d\u0440\u0438\u0442\u0440\u043e\u0433\u0435\u043d\u0438\u043d"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0441\u0440\u0435\u0434\u0430 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u0434\u043b\u044f \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u0431\u043e\u0440\u0434\u0435\u0442\u0435\u043b\u043b?","\u041a\u0430\u0437\u0435\u0438\u043d\u043e\u0432\u043e-\u0443\u0433\u043e\u043b\u044c\u043d\u044b\u0439 \u0430\u0433\u0430\u0440","\u041d\u0435\u043a\u0438\u0441\u043b\u043e\u0442\u043e\u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u044b\u0439","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430","\u0412\u044b\u044f\u0432\u043b\u0435\u043d\u0438\u0438 \u043a\u043e\u0440\u0434-\u0444\u0430\u043a\u0442\u043e\u0440\u0430"],["\u0423\u0437\u043d\u0430\u0439\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u043a\u043b\u0438\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0441\u0438\u043c\u043f\u0442\u043e\u043c \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u0435\u043d \u0434\u043b\u044f \u043a\u043e\u043a\u043b\u044e\u0448\u0430?","\u041f\u0440\u0438\u0441\u0442\u0443\u043f\u044b \u0441\u0443\u0434\u043e\u0440\u043e\u0436\u043d\u043e\u0433\u043e \u043a\u0430\u0448\u043b\u044f","\u041d\u0435\u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044b\u0439 \u0444\u0430\u0433\u043e\u0446\u0438\u0442\u043e\u0437","\u0424\u0435\u043a\u0430\u043b\u044c\u043d\u043e-\u043e\u0440\u0430\u043b\u044c\u043d\u044b\u0439","\u041a\u043e\u043b\u043e\u043d\u0438\u0438 \u0432 \u0432\u0438\u0434\u0435 \"\u043a\u0430\u043f\u0435\u043b\u0435\u043a \u0440\u0442\u0443\u0442\u0438\""],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u043f\u0440\u0435\u043f\u0430\u0440\u0430\u0442 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0434\u043b\u044f \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u043a\u043e\u043a\u043b\u044e\u0448\u0430?","\u0423\u0431\u0438\u0442\u0430\u044f \u0432\u0430\u043a\u0446\u0438\u043d\u0430","\u0410\u043d\u0430\u0442\u043e\u043a\u0441\u0438\u043d","\u0444\u0435\u043a\u0430\u043b\u044c\u043d\u043e-\u043e\u0440\u0430\u043b\u044c\u043d\u044b\u0439","\u0425\u0430\u0440\u0430\u043a\u0442\u0435\u0440 \u043a\u043e\u043b\u043e\u043d\u0438\u0439 \u043d\u0430 \u0442\u0432\u0435\u0440\u0434\u043e\u0439 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u0441\u0440\u0435\u0434\u0435"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0441\u0440\u0435\u0434\u0430 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0434\u043b\u044f \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u0442\u0443\u0431\u0435\u0440\u043a\u0443\u043b\u0435\u0437\u043d\u044b\u0445 \u043f\u0430\u043b\u043e\u0447\u0435\u043a?","\u0421\u0440\u0435\u0434\u0430 \u041b\u0435\u0432\u0435\u043d\u0448\u0442\u0435\u0439\u043d\u0430-\u0418\u0435\u043d\u0441\u0435\u043d\u0430","\u0411\u043e\u043b\u044c\u043d\u044b\u0435 \u043e\u0442\u043a\u0440\u044b\u0442\u043e\u0439 \u0444\u043e\u0440\u043c\u043e\u0439 \u0442\u0443\u0431\u0435\u0440\u043a\u0443\u043b\u0435\u0437\u0430","\u041d\u0435\u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044b\u0439 \u0444\u0430\u0433\u043e\u0446\u0438\u0442\u043e\u0437","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0438\u0439"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0442\u043e \u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u043e\u043c \u0437\u0430\u0440\u0430\u0436\u0435\u043d\u0438\u044f \u0442\u0443\u0431\u0435\u0440\u043a\u0443\u043b\u0435\u0437\u043e\u043c?","\u0411\u043e\u043b\u044c\u043d\u044b\u0435 \u043e\u0442\u043a\u0440\u044b\u0442\u043e\u0439 \u0444\u043e\u0440\u043c\u043e\u0439 \u0442\u0443\u0431\u0435\u0440\u043a\u0443\u043b\u0435\u0437\u0430","\u0410\u043d\u0442\u0438\u0442\u043e\u043a\u0441\u0438\u0447\u0435\u0441\u043a\u0438\u0439","\u041d\u0435\u043a\u0438\u0441\u043b\u043e\u0442\u043e\u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u044b\u0439","\u041a\u0440\u043e\u0432\u044f\u043d\u043e-\u0442\u0435\u043b\u043b\u0443\u0440\u0438\u0442\u043e\u0432\u0430\u044f"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043d\u0430 \u0447\u0435\u043c \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0430 \u0443\u0441\u043a\u043e\u0440\u0435\u043d\u043d\u0430\u044f \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0434\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u043a\u0430 \u0442\u0443\u0431\u0435\u0440\u043a\u0443\u043b\u0435\u0437\u0430?","\u0412\u044b\u044f\u0432\u043b\u0435\u043d\u0438\u0438 \u043a\u043e\u0440\u0434-\u0444\u0430\u043a\u0442\u043e\u0440\u0430","\u041a\u043e\u043b\u043e\u043d\u0438\u0438 \u0432 \u0432\u0438\u0434\u0435 \"\u043a\u0430\u043f\u0435\u043b\u0435\u043a \u0440\u0442\u0443\u0442\u0438\"","\u041a\u0440\u043e\u0432\u044f\u043d\u043e-\u0442\u0435\u043b\u043b\u0443\u0440\u0438\u0442\u043e\u0432\u0430\u044f","\u0422\u0443\u0431\u0435\u0440\u043a\u0443\u043b\u0438\u043d\u043e\u043c"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u0441 \u043a\u0430\u043a\u0438\u043c \u0430\u043b\u043b\u0435\u0440\u0433\u0435\u043d\u043e\u043c \u0441\u0442\u0430\u0432\u044f\u0442 \u0432\u043d\u0443\u0442\u0440\u0438\u043a\u043e\u0436\u043d\u0443\u044e \u043f\u0440\u043e\u0431\u0443 \u041c\u0430\u043d\u0442\u0443?","\u0422\u0443\u0431\u0435\u0440\u043a\u0443\u043b\u0438\u043d\u043e\u043c","\u041f\u043b\u0430\u0437\u043c\u043e\u043a\u043e\u0430\u0433\u0443\u043b\u0430\u0437\u044b","\u0410\u043d\u0430\u0442\u043e\u043a\u0441\u0438\u043d","\u0444\u0435\u043a\u0430\u043b\u044c\u043d\u043e-\u043e\u0440\u0430\u043b\u044c\u043d\u044b\u0439"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0443\u044e \u0432\u0430\u043a\u0446\u0438\u043d\u0443 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u044e\u0442 \u0434\u043b\u044f \u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u0442\u0443\u0431\ 3d\u044b\u0445 \u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430\u0445","\u041d\u0412s","\u043a\u0430\u043f\u0441\u0443\u043b\u0430, \u043c\u0438\u043a\u0440\u043e\u043a\u0430\u043f\u0441\u0443\u043b\u0430, \u0441\u043b\u0438\u0437\u044c, \u0436\u0433\u0443\u0442\u0438\u043a\u0438, \u043f\u0438\u043b\u0438"],["\u0423\u0437\u043d\u0430\u0439\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u043f\u0443\u0442\u044c \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0438 \u043f\u0440\u0438 \u0433\u0435\u043f\u0430\u0442\u0438\u0442\u0435 \u0421?","\u041f\u0430\u0440\u044d\u043d\u0442\u0430\u0440\u0430\u043b\u044c\u043d\u044b\u0439","\u0412\u0430\u043a\u0446\u0438\u043d\u0443","\u0418\u043c\u043c\u0443\u043d\u043e\u0433\u043b\u043e\u0431\u0443\u043b\u0438\u043d","\u0438\u0437-\u0437\u0430 \u043d\u0430\u043b\u0438\u0447\u0438\u044f \u043c\u043d\u043e\u0433\u043e\u0441\u043b\u043e\u0439\u043d\u043e\u0439 \u043e\u0431\u043e\u043b\u043e\u0447\u043a\u0438, \u0434\u0438 \u043f\u0438\u043a\u043e\u043b\u0438\u043d\u0430\u0442\u0430 \u043a\u0430\u043b\u044c\u0446\u0438\u044f, \u043d\u0438\u0437\u043a\u043e\u0433\u043e \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u043d\u0438\u044f \u0432\u043e\u0434\u044b \u0438 \u0432\u044f\u043b\u044b\u0445 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u043e\u0432 \u043c\u0435\u0442\u0430\u0431\u043e\u043b\u0438\u0437 \u043c\u0430"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u044f \u043e\u0442\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u043a \u0430\u0440\u0431\u043e\u0432\u0438\u0440\u0443\u0441\u043d\u044b\u043c?","\u0416\u0435\u043b\u0442\u0430\u044f \u043b\u0438\u0445\u043e\u0440\u0430\u0434\u043a\u0430","\u041f\u0440\u0438\u0440\u043e\u0434\u043d\u043e-\u043e\u0447\u0430\u0433\u043e\u0432\u0430\u044f","\u041f\u0430\u0440\u0435\u043d\u0442\u0435\u0440\u0430\u043b\u044c\u043d\u044b\u0439","\u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0437\u0430\u043f\u0430\u0441\u043d\u044b\u0445 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0432\u0435\u0449\u0435\u0441\u0442\u0432"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043a \u043a\u0430\u043a\u043e\u043c\u0443 \u0432\u0438\u0434\u0443 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u0439 \u043e\u0442\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u043a\u043b\u0435\u0449\u0435\u0432\u043e\u0439 \u044d\u043d\u0446\u0435\u0444\u0430\u043b\u0438\u0442?","\u041f\u0440\u0438\u0440\u043e\u0434\u043d\u043e-\u043e\u0447\u0430\u0433\u043e\u0432\u0430\u044f","\u0424\u0435\u043a\u0430\u043b\u044c\u043d\u043e-\u043e\u0440\u0430\u043b\u044c\u043d\u044b\u0439","\u0437\u0430\u043d\u0438\u043c\u0430\u0435\u0442 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0439 \u043e\u0431\u044a\u0435\u043c \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0430\u043b\u044c\u043d\u043e\u0439 \u043a\u043b\u0435\u0442\u043a\u0438","\u043f\u0440\u043e\u0447\u043d\u043e\u0441\u0442\u044c \u0438 \u0443\u043f\u0440\u0443\u0433\u043e\u0441\u0442\u044c"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u043c \u043f\u0443\u0442\u0435\u043c \u043f\u0435\u0440\u0435\u0434\u0430\u0435\u0442\u0441\u044f \u0432\u0438\u0440\u0443\u0441 \u043a\u043b\u0435\u0449\u0435\u0432\u043e\u0433\u043e \u044d\u043d\u0446\u0435\u0444\u0430\u043b\u0438\u0442\u0430?","\u0422\u0440\u0430\u043d\u0441\u043c\u0438\u0441\u0441\u0438\u0432\u043d\u044b\u043c","\u0418\u043c\u043c\u0443\u043d\u043e\u0433\u043b\u043e\u0431\u0443\u043b\u0438\u043d","\u041f\u0440\u0438\u0440\u043e\u0434\u043d\u043e-\u043e\u0447\u0430\u0433\u043e\u0432\u0430\u044f","\u0438\u0437-\u0437\u0430 \u043d\u0430\u043b\u0438\u0447\u0438\u044f \u043c\u043d\u043e\u0433\u043e\u0441\u043b\u043e\u0439\u043d\u043e\u0439 \u043e\u0431\u043e\u043b\u043e\u0447\u043a\u0438, \u0434\u0438 \u043f\u0438\u043a\u043e\u043b\u0438\u043d\u0430\u0442\u0430 \u043a\u0430\u043b\u044c\u0446\u0438\u044f, \u043d\u0438\u0437\u043a\u043e\u0433\u043e \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u043d\u0438\u044f \u0432\u043e\u0434\u044b \u0438 \u0432\u044f\u043b\u044b\u0445 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u043e\u0432 \u043c\u0435\u0442\u0430\u0431\u043e\u043b\u0438\u0437 \u043c\u0430"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u0447\u0442\u043e \u0438\u043c\u0435\u0435\u0442 \u0434\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u0447\u0435\u0441\u043a\u043e\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435 \u043f\u0440\u0438 \u0430\u0440\u0431\u043e\u0432\u0438\u0440\u0443\u0441\u043d\u044b\u0445 \u0438\u043d\u0444\u0435\u043a\u0446\u0438\u044f\u0445?","\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0435\u043d\u0438\u0435 \u0430\u043d\u0442\u0438\u0442\u0435\u043b \u0432 \u043f\u0430\u0440\u043d\u044b\u0445 \u0441\u044b\u0432\u043e\u0440\u043e\u0442\u043a\u0430\u0445","\u043f\u0438\u043b\u0438, \u0444\u0438\u043c\u0431\u0440\u0438\u0438","\u0437\u0430\u043d\u0438\u043c\u0430\u0435\u0442 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0439 \u043e\u0431\u044a\u0435\u043c \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0430\u043b\u044c\u043d\u043e\u0439 \u043a\u043b\u0435\u0442\u043a\u0438","\u0413\u0435\u043f\u0430\u0442\u0438\u0442\u0430 \u0410"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u0447\u0442\u043e \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u044e\u0442 \u0434\u043b\u044f \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u043a\u043b\u0435\u0449\u0435\u0432\u043e\u0433\u043e \u044d\u043d\u0446\u0435\u0444\u0430\u043b\u0438\u0442\u0430?","\u0412\u0430\u043a\u0446\u0438\u043d\u0443","\u041f\u0430\u0440\u044d\u043d\u0442\u0430\u0440\u0430\u043b\u044c\u043d\u044b\u0439","\u0418\u043c\u043c\u0443\u043d\u043e\u0444\u0435\u0440\u043c\u0435\u043d\u0442\u043d\u044b\u0439 \u0430\u043d\u0430\u043b\u0438\u0437","\u0422\u0440\u0430\u043d\u0441\u043c\u0438\u0441\u0441\u0438\u0432\u043d\u044b\u043c"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u043f\u0440\u0435\u043f\u0430\u0440\u0430\u0442 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u044e\u0442 \u0434\u043b\u044f \u044d\u043a\u0441\u0442\u0440\u0435\u043d\u043d\u043e\u0439 \u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u043a\u043b\u0435\u0449\u0435\u0432\u043e\u0433\u043e \u044d\u043d\u0446\u0435\u0444\u0430\u043b\u0438\u0442\u0430?","\u0418\u043c\u043c\u0443\u043d\u043e\u0433\u043b\u043e\u0431\u0443\u043b\u0438\u043d","\u041f\u0430\u0440\u044d\u043d\u0442\u0430\u0440\u0430\u043b\u044c\u043d\u044b\u0439","\u043a\u0430\u0440\u0431\u043e\u043b\u043e\u0432\u044b\u0439 \u0444\u0443\u043a\u0441\u0438\u043d, \u043c\u0435\u0442\u0438\u043b\u0435\u043d\u043e\u0432\u044b\u0439 \u0441\u0438\u043d\u0438\u0439, \u0441\u0435\u0440\u043d\u0430\u044f \u043a\u0438\u0441\u043b\u043e\u0442\u0430","\u0413\u0435\u043f\u0430\u0442\u0438\u0442 \u0412"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u043c \u043f\u0443\u0442\u0435\u043c \u0437\u0430\u0440\u0430\u0436\u0430\u0435\u0442\u0441\u044f \u0447\u0435\u043b\u043e\u0432\u0435\u043a \u0432\u0438\u0440\u0443\u0441\u043e\u043c \u043e\u043c\u0441\u043a\u043e\u0439 \u0433\u0435\u043c\u043e\u0440\u0440\u0430\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043b\u0438\u0445\u043e\u0440\u0430\u0434\u043a\u0438?","\u0422\u0440\u0430\u043d\u0441\u043c\u0438\u0441\u0441\u0438\u0432\u043d\u044b\u043c","\u041f\u0430\u0440\u044d\u043d\u0442\u0430\u0440\u0430\u043b\u044c\u043d\u044b\u0439","\u043f\u0438\u043b\u0438, \u0444\u0438\u043c\u0431\u0440\u0438\u0438","\u0420\u0435\u043a\u043e\u043c\u0431\u0438\u043d\u0430\u043d\u0442\u043d\u043e\u0439"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u044b \u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0434\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c\u0438 \u0434\u043b\u044f \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439?","\u043a\u0430\u043f\u0441\u0443\u043b\u0430, \u043c\u0438\u043a\u0440\u043e\u043a\u0430\u043f\u0441\u0443\u043b\u0430, \u0441\u043b\u0438\u0437\u044c, \u0436\u0433\u0443\u0442\u0438\u043a\u0438, \u043f\u0438\u043b\u0438","\u041f\u0440\u0438\u0440\u043e\u0434\u043d\u043e-\u043e\u0447\u0430\u0433\u043e\u0432\u0430\u044f","\u0420\u041d\u041a-\u0433\u0435\u043d\u043e\u043c","\u0437\u0430\u043d\u0438\u043c\u0430\u0435\u0442 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0439 \u043e\u0431\u044a\u0435\u043c \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0430\u043b\u044c\u043d\u043e\u0439 \u043a\u043b\u0435\u0442\u043a\u0438"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a \u043a\u0430\u043a\u043e\u043c\u0443 \u0442\u0438\u043f\u0443 \u0436\u0438\u0432\u044b\u0445 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u043e\u0432 \u043e\u0442\u043d\u043e\u0441\u044f\u0442 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0438?","\u043f\u0440\u043e\u043a\u0430\u0440\u0438\u043e\u0442\u0430\u043c","\u0420\u0435\u043a\u043e\u043c\u0431\u0438\u043d\u0430\u043d\u0442\u043d\u043e\u0439","\u0416\u0435\u043b\u0442\u0430\u044f \u043b\u0438\u0445\u043e\u0440\u0430\u0434\u043a\u0430","\u0418\u043c\u043c\u0443\u043d\u043d\u0430\u044f \u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u0430\u044f \u043c\u0438\u043a\u0440\u043e\u0441\u043a\u043e\u043f\u0438\u044f"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u044d\u0442\u0430\u043f \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u0435\u0442 \u043f\u0440\u0438 \u043e\u043a\u0440\u0430\u0441\u043a\u0435 \u043f\u043e \u0413\u0440\u0430\u043c\u0443?","\u044d\u0442\u0430\u043f \u043f\u0440\u043e\u0433\u0440\u0435\u0432\u0430\u043d\u0438\u044f \u043c\u0430\u0437\u043a\u0430 \u0441 \u043a\u0440\u0430\u0441\u0438\u0442\u0435\u043b\u0435\u043c","\u041f\u0440\u0438\u0440\u043e\u0434\u043d\u043e-\u043e\u0447\u0430\u0433\u043e\u0432\u0430\u044f","\u0444\u043e\u0440\u043c\u043e\u0439, \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e\u043c \u0438 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043e\u043c \u0437\u0430\u0432\u0438\u0442\u043a\u043e\u0432","\u043a\u0430\u0440\u0431\u043e\u043b\u043e\u0432\u044b\u0439 \u0444\u0443\u043a\u0441\u0438\u043d, \u043c\u0435\u0442\u0438\u043b\u0435\u043d\u043e\u0432\u044b\u0439 \u0441\u0438\u043d\u0438\u0439, \u0441\u0435\u0440\u043d\u0430\u044f \u043a\u0438\u0441\u043b\u043e\u0442\u0430"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u043e \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u043e \u0434\u043b\u044f \u043a\u043b\u0435\u0442\u043e\u0447\u043d\u043e\u0439 \u0441\u0442\u0435\u043d\u043a\u0438?","\u043f\u0440\u043e\u0447\u043d\u043e\u0441\u0442\u044c \u0438 \u0443\u043f\u0440\u0443\u0433\u043e\u0441\u0442\u044c","\u0412\u0430\u043a\u0446\u0438\u043d\u0443","\u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0437\u0430\u043f\u0430\u0441\u043d\u044b\u0445 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0432\u0435\u0449\u0435\u0441\u0442\u0432","\u041d\u0412s"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0435 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u043e \u0446\u0438\u0442\u043e\u043f\u043b\u0430\u0437\u043c\u044b \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439?","\u0437\u0430\u043d\u0438\u043c\u0430\u0435\u0442 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0439 \u043e\u0431\u044a\u0435\u043c \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0430\u043b\u044c\u043d\u043e\u0439 \u043a\u043b\u0435\u0442\u043a\u0438","\u0416\u0435\u043b\u0442\u0430\u044f \u043b\u0438\u0445\u043e\u0440\u0430\u0434\u043a\u0430","\u043f\u043e \u041d\u0435\u0439\u0441\u0441\u0435\u0440\u0443","\u041d\u0412s"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u0447\u0435\u043c \u043e\u0431\u0443\u0441\u043b\u043e\u0432\u043b\u0435\u043d\u043e \u0432\u044b\u0441\u043e\u043a\u0430\u044f \u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c \u0441\u043f\u043e\u0440?","\u0438\u0437-\u0437\u0430 \u043d\u0430\u043b\u0438\u0447\u0438\u044f \u043c\u043d\u043e\u0433\u043e\u0441\u043b\u043e\u0439\u043d\u043e\u0439 \u043e\u0431\u043e\u043b\u043e\u0447\u043a\u0438, \u0434\u0438 \u043f\u0438\u043a\u043e\u043b\u0438\u043d\u0430\u0442\u0430 \u043a\u0430\u043b\u044c\u0446\u0438\u044f, \u043d\u0438\u0437\u043a\u043e\u0433\u043e \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u043d\u0438\u044f \u0432\u043e\u0434\u044b \u0438 \u0432\u044f\u043b\u044b\u0445 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u043e\u0432 \u043c\u0435\u0442\u0430\u0431\u043e\u043b\u0438\u0437 \u043c\u0430","\u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u043d\u0430 \u0438\u0441\u043a\u0443\u0441\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0441\u0440\u0435\u0434\u0430\u0445","\u0422\u0440\u0430\u043d\u0441\u043c\u0438\u0441\u0441\u0438\u0432\u043d\u044b\u043c","\u0416\u0435\u043b\u0442\u0430\u044f \u043b\u0438\u0445\u043e\u0440\u0430\u0434\u043a\u0430"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u0443\u044e \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u044e\u0442 \u0437\u0435\u0440\u043d\u0430 \u0432\u043e\u043b\u044e\u0442\u0438\u043d\u0430?","\u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0437\u0430\u043f\u0430\u0441\u043d\u044b\u0445 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0432\u0435\u0449\u0435\u0441\u0442\u0432","\u0422\u0440\u0430\u043d\u0441\u043c\u0438\u0441\u0441\u0438\u0432\u043d\u044b\u043c","\u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435 \u0441\u043a\u0438\u0435 \u043f\u043e\u0440\u0430\u0436\u0435\u043d\u0438\u044f \u043e\u0431\u043e\u043b\u043e\u0447\u0435\u043a \u0438 \u0442\u0435\u043b\u0430 \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430 (\u043e\u0441\u043f\u0438\u043d\u044b, \u043a\u0440\u043e\u0432\u043e\u0438\u0437\u043b\u0438\u044f\u043d\u0438\u044f); \u0433\u0438\u0431\u0435\u043b\u044c \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430; \u043f\u043e\u043b\u043e\u0436\u0438\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0420\u0413\u0410 \u0441 \u0432\u0438\u0440\u0443\u0441\u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0449\u0435\u0439 \u0436\u0438\u0434\u043a\u043e\u0441\u0442\u044c\u044e, \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u043d\u043e\u0439 \u0438\u0437 \u043f\u043e\u043b\u043e\u0441\u0442\u0435\u0439 \u0437\u0430\u0440\u0430\u0436\u0435\u043d\u043d\u043e\u0433\u043e \u0437\u0430\u0440\u043e\u0434\u044b\u0448\u0430.","\u043f\u0440\u0438\u0433\u043e\u0442\u043e\u0432\u043b\u0435\u043d\u0438\u0435 \u043c\u0430\u0437\u043a\u0430, \u0432\u044b\u0441\u0443\u0448\u0438\u0432\u0430\u043d\u0438\u0435, \u0444\u0438\u043a\u0441\u0430\u0446\u0438\u044f \u0438 \u043e\u043a\u0440\u0430\u0441\u043a\u0430"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u0434\u043b\u044f \u0432\u044b\u044f\u0432\u043b\u0435\u043d\u0438\u044f \u0447\u0435\u0433\u043e \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u043e\u043a\u0440\u0430\u0441\u043a\u0430 \u043f\u043e \u041d\u0435\u0439\u0441\u0441\u0435\u0440\u0443?","\u0437\u0435\u0440\u043d\u0430 \u0432\u043e\u043b\u044e\u0442\u0438\u043d\u0430","\u0432 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u0435 \u043b\u0430\u0431\u043e\u0440\u0430\u0442\u043e\u0440\u043d\u044b\u0445 \u0436\u0438\u0432\u043e\u0442\u043d\u044b\u0445, \u0432 \u0440\u0430\u0437\u0432\u0438\u0432\u0430\u044e\u0449\u0438\u0445\u0441\u044f \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430\u0445 \u043f\u0442\u0438\u0446 (\u0447\u0430\u0449\u0435 \u043d\u0430 \u043a\u0443\u0440\u0438\u043d\u044b\u0445 \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430\u0445) \u0438 \u043a\u0443\u043b\u044c\u0442\u0443\u0440\u0430\u0445 \u043a\u043b\u0435\u0442\u043e\u043a (\u0442\u043a\u0430\u043d\u0435\u0439)","\u043a\u0430\u043f\u0441\u0443\u043b\u0430, \u043c\u0438\u043a\u0440\u043e\u043a\u0430\u043f\u0441\u0443\u043b\u0430, \u0441\u043b\u0438\u0437\u044c, \u0436\u0433\u0443\u0442\u0438\u043a\u0438, \u043f\u0438\u043b\u0438","\u0422\u0440\u0430\u043d\u0441\u043c\u0438\u0441\u0441\u0438\u0432\u043d\u044b\u043c"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043e\u043a\u0440\u0430\u0441\u043a\u043e\u0439 \u043f\u043e \u043a\u0430\u043a\u043e\u043c\u0443 \u043c\u0435\u0442\u043e\u0434\u0443 \u0432\u044b\u044f\u0432\u043b\u044f\u0435\u043c \u0437\u0435\u0440\u043d\u0430 \u0432\u043e\u043b\u044e\u0442\u0438\u043d\u0430?","\u043f\u043e \u041d\u0435\u0439\u0441\u0441\u0435\u0440\u0443","\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u0430\u044f \u0441\u0442\u0435\u043d\u043a\u0430","\u043f\u0438\u043b\u0438, \u0444\u0438\u043c\u0431\u0440\u0438\u0438","\u041f\u0430\u0440\u044d\u043d\u0442\u0430\u0440\u0430\u043b\u044c\u043d\u044b\u0439"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u044d\u0442\u0430\u043f \u043f\u0440\u0435\u0434\u0443\u0441\u043c\u0430\u0442\u0440\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u043f\u0440\u0438 \u043f\u0440\u0438\u0433\u043e\u0442\u043e\u0432\u043b\u0435\u043d\u0438\u0438 \u043f\u0440\u0435\u043f\u0430\u0440\u0430\u0442\u0430 \u0434\u043b\u044f \u043c\u0438\u043a\u0440\u043e\u0441\u043a\u043e\u043f\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u0438\u0441\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u044f?","\u043f\u0440\u0438\u0433\u043e\u0442\u043e\u0432\u043b\u0435\u043d\u0438\u0435 \u043c\u0430\u0437\u043a\u0430, \u0432\u044b\u0441\u0443\u0448\u0438\u0432\u0430\u043d\u0438\u0435, \u0444\u0438\u043a\u0441\u0430\u0446\u0438\u044f \u0438 \u043e\u043a\u0440\u0430\u0441\u043a\u0430","\u0441\u043e\u0437\u0434\u0430\u043d\u0438\u0435 \u0444\u0430\u0433\u043e\u0446\u0438\u0442\u0430\u0440\u043d\u043e\u0439 \u0442\u0435\u043e\u0440\u0438\u0438 \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442\u0430","\u0440\u0430\u0437\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u043c\u0435\u0442\u043e\u0434\u043e\u0432 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f \u0447\u0438\u0441\u0442\u044b\u0445 \u043a\u0443\u043b\u044c\u0442\u0443\u0440","\u043e\u0431\u043b\u0438\u0433\u0430\u0442\u043d\u044b\u0435 (\u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435) \u0432\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u0435 \u043f\u0430 \u0440\u0430\u0437\u0438\u0442\u044b"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0430 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u0435\u0442 \u0441\u043f\u043e\u0441\u043e\u0431\u043d\u043e\u0441\u0442\u044c \u0432\u043e\u0441\u043f\u0440\u0438\u043d\u0438\u043c\u0430\u0442\u044c \u043a\u0440\u0430\u0441\u0438\u0442\u0435\u043b\u0438 (\u0442\u0438\u043d\u043a\u0442\u043e\u0440\u0438\u0430\u043b\u044c\u043d\u044b\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u0430)?","\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u0430\u044f \u0441\u0442\u0435\u043d\u043a\u0430","\u043a\u0430\u0440\u0431\u043e\u043b\u043e\u0432\u044b\u0439 \u0444\u0443\u043a\u0441\u0438\u043d, \u043c\u0435\u0442\u0438\u043b\u0435\u043d\u043e\u0432\u044b\u0439 \u0441\u0438\u043d\u0438\u0439, \u0441\u0435\u0440\u043d\u0430\u044f \u043a\u0438\u0441\u043b\u043e\u0442\u0430","\u0444\u043e\u0440\u043c\u043e\u0439, \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e\u043c \u0438 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043e\u043c \u0437\u0430\u0432\u0438\u0442\u043a\u043e\u0432","\u041f\u0440\u0438\u0440\u043e\u0434\u043d\u043e-\u043e\u0447\u0430\u0433\u043e\u0432\u0430\u044f"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u0440\u0430\u0441\u0442\u0432\u043e\u0440 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u044e\u0442 \u043f\u0440\u0438 \u043e\u043a\u0440\u0430\u0441\u043a\u0435 \u043f\u043e \u0426\u0438\u043b\u044e-\u041d\u0438\u043b\u044c\u0441\u0435\u043d\u0443?","\u043a\u0430\u0440\u0431\u043e\u043b\u043e\u0432\u044b\u0439 \u0444\u0443\u043a\u0441\u0438\u043d, \u043c\u0435\u0442\u0438\u043b\u0435\u043d\u043e\u0432\u044b\u0439 \u0441\u0438\u043d\u0438\u0439, \u0441\u0435\u0440\u043d\u0430\u044f \u043a\u0438\u0441\u043b\u043e\u0442\u0430","\u0444\u043e\u0440\u043c\u043e\u0439, \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e\u043c \u0438 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043e\u043c \u0437\u0430\u0432\u0438\u0442\u043a\u043e\u0432","\u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u043d\u0430 \u0438\u0441\u043a\u0443\u0441\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0441\u0440\u0435\u0434\u0430\u0445","\u043e\u0431\u043e\u0441\u043d\u043e\u0432\u0430\u043b \u043f\u0440\u0438\u043d\u0446\u0438\u043f \u0432\u0430\u043a\u0446\u0438\u043d\u0430\u0446\u0438\u0438 \u0438 \u0441\u043f\u043e\u0441\u043e\u0431 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f \u0432\u0430\u043a\u0446\u0438\u043d"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u0441 \u043d\u0430\u043b\u0438\u0447\u0438\u0435\u043c \u0447\u0435\u0433\u043e \u0441\u0432\u044f\u0437\u0430\u043d\u0430 \u043a\u0438\u0441\u043b\u043e\u0442\u043e\u0443\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u044c \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439?","\u041c\u0438\u043a\u043e\u043b\u043e\u0432\u044b\u0435 \u043a\u0438\u0441\u043b\u043e\u0442\u044b \u0438 \u043b\u0438\u043f\u0438\u0434\u044b","\u043d\u0443\u043a\u043b\u0435\u0438\u043d\u043e\u0432\u0430\u044f \u043a\u0438\u0441\u043b\u043e\u0442\u0430 \u0438 \u043a\u0430\u043f\u0441\u0438\u0434","\u041f\u0430\u0440\u044d\u043d\u0442\u0430\u0440\u0430\u043b\u044c\u043d\u044b\u0439","\u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c, \u043e\u043f\u0442\u0438\u043c\u0443\u043c Ph, \u0438\u0437\u043e\u0442\u043e\u043d\u0438\u0447\u043d\u043e\u0441\u0442\u044c, \u0441\u0442\u0435\u0440\u0438\u043b\u044c\u043d\u043e\u0441\u0442\u044c"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u0447\u0435\u043c \u043e\u0442\u043b\u0438\u0447\u0430\u0435\u0442\u0441\u044f \u043a\u0430\u0436\u0434\u044b\u0439 \u0440\u043e\u0434 \u0441\u043f\u0438\u0440\u043e\u0445\u0435\u0442?","\u0444\u043e\u0440\u043c\u043e\u0439, \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e\u043c \u0438 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043e\u043c \u0437\u0430\u0432\u0438\u0442\u043a\u043e\u0432","\u0416\u0435\u043b\u0442\u0430\u044f \u043b\u0438\u0445\u043e\u0440\u0430\u0434\u043a\u0430","\u0412\u0430\u043a\u0446\u0438\u043d\u0443","\u0422\u0440\u0430\u043d\u0441\u043c\u0438\u0441\u0441\u0438\u0432\u043d\u044b\u043c"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043d\u0430\u043b\u0438\u0447\u0438\u0435\u043c \u043a\u0430\u043a\u0438\u0445 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439 \u043e\u0431\u0443\u0441\u043b\u043e\u0432\u043b\u0435\u043d\u0430 \u0441\u043f\u043e\u0441\u043e\u0431\u043d\u043e\u0441\u0442\u044c \u043f\u0440\u0438\u043a\u0440\u0435\u043f\u043b\u044f\u0442\u044c\u0441\u044f \u043a \u043f\u043e\u0432\u0435\u0440\u0445\u043d\u043e\u0441\u0442\u0438 \u043a\u043b\u0435\u0442\u043e\u043a?","\u043f\u0438\u043b\u0438, \u0444\u0438\u043c\u0431\u0440\u0438\u0438","\u0437\u0435\u0440\u043d\u0430 \u0432\u043e\u043b\u044e\u0442\u0438\u043d\u0430","\u043a\u0430\u0440\u0431\u043e\u043b\u043e\u0432\u044b\u0439 \u0444\u0443\u043a\u0441\u0438\u043d, \u043c\u0435\u0442\u0438\u043b\u0435\u043d\u043e\u0432\u044b\u0439 \u0441\u0438\u043d\u0438\u0439, \u0441\u0435\u0440\u043d\u0430\u044f \u043a\u0438\u0441\u043b\u043e\u0442\u0430","\u0438\u0437-\u0437\u0430 \u043d\u0430\u043b\u0438\u0447\u0438\u044f \u043c\u043d\u043e\u0433\u043e\u0441\u043b\u043e\u0439\u043d\u043e\u0439 \u043e\u0431\u043e\u043b\u043e\u0447\u043a\u0438, \u0434\u0438 \u043f\u0438\u043a\u043e\u043b\u0438\u043d\u0430\u0442\u0430 \u043a\u0430\u043b\u044c\u0446\u0438\u044f, \u043d\u0438\u0437\u043a\u043e\u0433\u043e \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u043d\u0438\u044f \u0432\u043e\u0434\u044b \u0438 \u0432\u044f\u043b\u044b\u0445 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u043e\u0432 \u043c\u0435\u0442\u0430\u0431\u043e\u043b\u0438\u0437 \u043c\u0430"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0435 \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u043e \u043f\u0440\u0438\u0441\u0443\u0449\u0435 \u0440\u0438\u043a\u043a\u0435\u0442\u0441\u0438\u044f\u043c?","\u043e\u0431\u043b\u0438\u0433\u0430\u0442\u043d\u044b\u0435 (\u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435) \u0432\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u0435 \u043f\u0430 \u0440\u0430\u0437\u0438\u0442\u044b","\u043f\u0438\u043b\u0438, \u0444\u0438\u043c\u0431\u0440\u0438\u0438","\u0438\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439, \u0434\u043b\u044f \u043b\u0435\u0447\u0435\u043d\u0438\u044f \u0438 \u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0430\u043b\u044c\u043d\u044b\u0445 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u043d\u0438\u0439","\u0440\u0430\u0441\u0449\u0435\u043f\u043b\u044f\u0442\u044c \u0443\u0433\u043b\u0435\u0432\u043e\u0434\u044b, \u0441\u043f\u0438\u0440\u0442\u044b, \u0431\u0435\u043b\u043a\u0438 \u0441 \u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u043e\u0432"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u043e\u0441\u043d\u043e\u0432\u043d\u0430\u044f \u0437\u0430\u0441\u043b\u0443\u0433\u0430 \u0410\u043d\u0442\u043e\u043d\u0438\u044f \u041b\u0435\u0432\u0435\u043d\u0433\u0443\u043a\u0430 \u0432 \u043c\u0438\u043a\u0440\u043e\u0431\u0438\u043e\u043b\u043e\u0433\u0438\u0438?","\u0441\u043a\u043e\u043d\u0441\u0442\u0440\u0443\u0438\u0440\u043e\u0432\u0430\u043b \u043c\u0438\u043a\u0440\u043e\u0441\u043a\u043e\u043f \u0438 \u043f\u0435\u0440\u0432\u044b\u043c \u0443\u0432\u0438\u0434\u0435\u043b \u0438 \u0437\u0430\u0440\u0438\u0441\u043e\u0432\u0430\u043b \u043c\u0438\u043a\u0440\u043e\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u044b","\u043e\u0431\u043e\u0441\u043d\u043e\u0432\u0430\u043b \u043f\u0440\u0438\u043d\u0446\u0438\u043f \u0432\u0430\u043a\u0446\u0438\u043d\u0430\u0446\u0438\u0438 \u0438 \u0441\u043f\u043e\u0441\u043e\u0431 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f \u0432\u0430\u043a\u0446\u0438\u043d","\u043f\u0438\u043b\u0438, \u0444\u0438\u043c\u0431\u0440\u0438\u0438","\u0440\u0430\u0441\u0449\u0435\u043f\u043b\u044f\u0442\u044c \u0443\u0433\u043b\u0435\u0432\u043e\u0434\u044b, \u0441\u043f\u0438\u0440\u0442\u044b, \u0431\u0435\u043b\u043a\u0438 \u0441 \u043e\u0431\u0440\u0430\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u043e\u0432"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u043e\u0441\u043d\u043e\u0432\u043d\u0430\u044f \u0437\u0430\u0441\u043b\u0443\u0433\u0430 \u0418\u043b\u044c\u0438 \u0418\u043b\u044c\u0438\u0447\u0430 \u041c\u0435\u0447\u043d\u0438\u043a\u043e\u0432\u0430 \u0432 \u043c\u0438\u043a\u0440\u043e\u0431\u0438\u043e\u043b\u043e\u0433\u0438\u0438?","\u0441\u043e\u0437\u0434\u0430\u043d\u0438\u0435 \u0444\u0430\u0433\u043e\u0446\u0438\u0442\u0430\u0440\u043d\u043e\u0439 \u0442\u0435\u043e\u0440\u0438\u0438 \u0438\u043c\u043c\u0443\u043d\u0438\u0442\u0435\u0442\u0430","\u043a\u0430\u043f\u0441\u0443\u043b\u0430, \u043c\u0438\u043a\u0440\u043e\u043a\u0430\u043f\u0441\u0443\u043b\u0430, \u0441\u043b\u0438\u0437\u044c, \u0436\u0433\u0443\u0442\u0438\u043a\u0438, \u043f\u0438\u043b\u0438","\u0434\u043b\u044f \u0447\u0438\u0441\u0442\u044b\u0445 \u043a\u0443\u043b\u044c\u0442\u0443\u0440 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439","\u044d\u0442\u0430\u043f \u043f\u0440\u043e\u0433\u0440\u0435\u0432\u0430\u043d\u0438\u044f \u043c\u0430\u0437\u043a\u0430 \u0441 \u043a\u0440\u0430\u0441\u0438\u0442\u0435\u043b\u0435\u043c"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u043e\u0441\u043d\u043e\u0432\u043d\u0430\u044f \u0437\u0430\u0441\u043b\u0443\u0433\u0430 \u041b\u0443\u0438 \u041f\u0430\u0441\u0442\u0435\u0440\u0430 \u0432 \u043c\u0438\u043a\u0440\u043e\u0431\u0438\u043e\u043b\u043e\u0433\u0438\u0438?","\u043e\u0431\u043e\u0441\u043d\u043e\u0432\u0430\u043b \u043f\u0440\u0438\u043d\u0446\u0438\u043f \u0432\u0430\u043a\u0446\u0438\u043d\u0430\u0446\u0438\u0438 \u0438 \u0441\u043f\u043e\u0441\u043e\u0431 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f \u0432\u0430\u043a\u0446\u0438\u043d","\u0437\u0435\u0440\u043d\u0430 \u0432\u043e\u043b\u044e\u0442\u0438\u043d\u0430","\u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435 \u0441\u043a\u0438\u0435 \u043f\u043e\u0440\u0430\u0436\u0435\u043d\u0438\u044f \u043e\u0431\u043e\u043b\u043e\u0447\u0435\u043a \u0438 \u0442\u0435\u043b\u0430 \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430 (\u043e\u0441\u043f\u0438\u043d\u044b, \u043a\u0440\u043e\u0432\u043e\u0438\u0437\u043b\u0438\u044f\u043d\u0438\u044f); \u0433\u0438\u0431\u0435\u043b\u044c \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430; \u043f\u043e\u043b\u043e\u0436\u0438\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0420\u0413\u0410 \u0441 \u0432\u0438\u0440\u0443\u0441\u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0449\u0435\u0439 \u0436\u0438\u0434\u043a\u043e\u0441\u0442\u044c\u044e, \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u043d\u043e\u0439 \u0438\u0437 \u043f\u043e\u043b\u043e\u0441\u0442\u0435\u0439 \u0437\u0430\u0440\u0430\u0436\u0435\u043d\u043d\u043e\u0433\u043e \u0437\u0430\u0440\u043e\u0434\u044b\u0448\u0430.","\u043c\u0435\u0442\u043e\u0434\u043e\u043c \u0441\u0443\u0445\u043e\u0433\u043e \u0436\u0430\u0440\u0430"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u0430\u044f \u043e\u0441\u043d\u043e\u0432\u043d\u0430\u044f \u0437\u0430\u0441\u043b\u0443\u0433\u0430 \u0420\u043e\u0431\u0435\u0440\u0442\u0430 \u041a\u043e\u0445\u0430 \u0432 \u043c\u0438\u043a\u0440\u043e\u0431\u0438\u043e\u043b\u043e\u0433\u0438\u0438?","\u0440\u0430\u0437\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u043c\u0435\u0442\u043e\u0434\u043e\u0432 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f \u0447\u0438\u0441\u0442\u044b\u0445 \u043a\u0443\u043b\u044c\u0442\u0443\u0440","\u0444\u043e\u0442\u043e\u0430\u0432\u0442\u043e\u0442\u0440\u043e\u0444\u044b","\u0438\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439, \u0434\u043b\u044f \u043b\u0435\u0447\u0435\u043d\u0438\u044f \u0438 \u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0430\u043b\u044c\u043d\u044b\u0445 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u043d\u0438\u0439","\u0432 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u0435 \u043b\u0430\u0431\u043e\u0440\u0430\u0442\u043e\u0440\u043d\u044b\u0445 \u0436\u0438\u0432\u043e\u0442\u043d\u044b\u0445, \u0432 \u0440\u0430\u0437\u0432\u0438\u0432\u0430\u044e\u0449\u0438\u0445\u0441\u044f \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430\u0445 \u043f\u0442\u0438\u0446 (\u0447\u0430\u0449\u0435 \u043d\u0430 \u043a\u0443\u0440\u0438\u043d\u044b\u0445 \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430\u0445) \u0438 \u043a\u0443\u043b\u044c\u0442\u0443\u0440\u0430\u0445 \u043a\u043b\u0435\u0442\u043e\u043a (\u0442\u043a\u0430\u043d\u0435\u0439)"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u043c\u0435\u0442\u043e\u0434 \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u0435\u0442 \u043f\u0440\u0438 \u0438\u0437\u0443\u0447\u0435\u043d\u0438\u0438 \u0432\u0438\u0440\u0443\u0441\u043e\u0432?","\u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u043d\u0430 \u0438\u0441\u043a\u0443\u0441\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0441\u0440\u0435\u0434\u0430\u0445","\u0444\u043e\u0442\u043e\u0430\u0432\u0442\u043e\u0442\u0440\u043e\u0444\u044b","\u0444\u043e\u0440\u043c\u043e\u0439, \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e\u043c \u0438 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043e\u043c \u0437\u0430\u0432\u0438\u0442\u043a\u043e\u0432","\u0444\u043e\u0440\u043c\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0438\u043c\u043c\u0443\u043d\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043f\u0430\u043c\u044f\u0442\u0438, \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u0435 \u0432\u0442\u043e\u0440\u0438\u0447\u043d\u043e\u0433\u043e \u0438\u043c\u043c\u0443\u043d\u043d\u043e\u0433\u043e \u043e\u0442\u0432\u0435\u0442\u0430"],["\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u0438\u0442\u0435, \u0433\u0434\u0435 \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u0443\u044e\u0442 \u0432\u0438\u0440\u0443\u0441\u044b?","\u0432 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043c\u0435 \u043b\u0430\u0431\u043e\u0440\u0430\u0442\u043e\u0440\u043d\u044b\u0445 \u0436\u0438\u0432\u043e\u0442\u043d\u044b\u0445, \u0432 \u0440\u0430\u0437\u0432\u0438\u0432\u0430\u044e\u0449\u0438\u0445\u0441\u044f \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430\u0445 \u043f\u0442\u0438\u0446 (\u0447\u0430\u0449\u0435 \u043d\u0430 \u043a\u0443\u0440\u0438\u043d\u044b\u0445 \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430\u0445) \u0438 \u043a\u0443\u043b\u044c\u0442\u0443\u0440\u0430\u0445 \u043a\u043b\u0435\u0442\u043e\u043a (\u0442\u043a\u0430\u043d\u0435\u0439)","\u043e\u0431\u043b\u0438\u0433\u0430\u0442\u043d\u044b\u0435 (\u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435) \u0432\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u0435 \u043f\u0430 \u0440\u0430\u0437\u0438\u0442\u044b","\u043f\u0438\u043b\u0438, \u0444\u0438\u043c\u0431\u0440\u0438\u0438","\u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u043d\u0430 \u0438\u0441\u043a\u0443\u0441\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0441\u0440\u0435\u0434\u0430\u0445"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0439 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u043d\u044b\u0439 \u043a\u043e\u043c\u043f\u043e\u043d\u0435\u043d\u0442 \u0432\u0438\u0440\u0438\u043e\u043d\u0430?","\u043d\u0443\u043a\u043b\u0435\u0438\u043d\u043e\u0432\u0430\u044f \u043a\u0438\u0441\u043b\u043e\u0442\u0430 \u0438 \u043a\u0430\u043f\u0441\u0438\u0434","\u0432\u0438\u0440\u0443\u0441\u0430 \u0433\u0435\u043f\u0430\u0442\u0438\u0442\u0430 D","\u043f\u0440\u0438\u0433\u043e\u0442\u043e\u0432\u043b\u0435\u043d\u0438\u0435 \u043c\u0430\u0437\u043a\u0430, \u0432\u044b\u0441\u0443\u0448\u0438\u0432\u0430\u043d\u0438\u0435, \u0444\u0438\u043a\u0441\u0430\u0446\u0438\u044f \u0438 \u043e\u043a\u0440\u0430\u0441\u043a\u0430","\u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442 \u043d\u0430\u0441\u043b\u0435\u0434\u0441\u0442\u0432\u0435\u043d\u043d\u0443\u044e (\u0433\u0435\u043d\u043e\u043c\u043d\u0443\u044e) \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0438 \u0444\u0443\u043d\u043a\u0446\u0438\u044e \u043c\u0430\u0442\u0440\u0438\u0447\u043d\u043e\u0439, \u0438\u043b\u0438 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u043e\u043d\u043d\u043e\u0439 \u0420\u041d\u041a"],["\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435, \u043d\u0430 \u043a\u0430\u043a\u043e\u043c \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u0438 \u043e\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043b\u044f\u044e\u0442 \u0438\u043d\u0434\u0438\u043a\u0430\u0446\u0438\u044e \u0432\u0438\u0440\u0443\u0441\u043e\u0432 \u043f\u0440\u0438 \u043a\u0443\u043b\u044c\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0438 \u043d\u0430 \u043a\u0443\u0440\u0438\u043d\u044b\u0445 \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430\u0445?","\u0441\u043f\u0435\u0446\u0438\u0444\u0438\u0447\u0435 \u0441\u043a\u0438\u0435 \u043f\u043e\u0440\u0430\u0436\u0435\u043d\u0438\u044f \u043e\u0431\u043e\u043b\u043e\u0447\u0435\u043a \u0438 \u0442\u0435\u043b\u0430 \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430 (\u043e\u0441\u043f\u0438\u043d\u044b, \u043a\u0440\u043e\u0432\u043e\u0438\u0437\u043b\u0438\u044f\u043d\u0438\u044f); \u0433\u0438\u0431\u0435\u043b\u044c \u044d\u043c\u0431\u0440\u0438\u043e\u043d\u0430; \u043f\u043e\u043b\u043e\u0436\u0438\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0420\u0413\u0410 \u0441 \u0432\u0438\u0440\u0443\u0441\u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0449\u0435\u0439 \u0436\u0438\u0434\u043a\u043e\u0441\u0442\u044c\u044e, \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u043d\u043e\u0439 \u0438\u0437 \u043f\u043e\u043b\u043e\u0441\u0442\u0435\u0439 \u0437\u0430\u0440\u0430\u0436\u0435\u043d\u043d\u043e\u0433\u043e \u0437\u0430\u0440\u043e\u0434\u044b\u0448\u0430.","\u043f\u0440\u0438\u0433\u043e\u0442\u043e\u0432\u043b\u0435\u043d\u0438\u0435 \u043c\u0430\u0437\u043a\u0430, \u0432\u044b\u0441\u0443\u0448\u0438\u0432\u0430\u043d\u0438\u0435, \u0444\u0438\u043a\u0441\u0430\u0446\u0438\u044f \u0438 \u043e\u043a\u0440\u0430\u0441\u043a\u0430","\u0441\u043f\u0438\u0440\u0430\u043b\u044c\u043d\u043e\u043c\u0443, \u0438\u043a\u043e\u0441\u0430\u044d\u0434\u0440\u0438\u0447\u0435\u0441\u043a\u043e\u043c\u0443 \u0438 \u0441\u043b\u043e\u0436\u043d\u043e\u043c\u0443","\u0444\u043e\u0440\u043c\u043e\u0439, \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e\u043c \u0438 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043e\u043c \u0437\u0430\u0432\u0438\u0442\u043a\u043e\u0432"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u0438\u0435 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u043d\u044b\u0435 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u044b \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u043d\u044b \u0434\u043b\u044f \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u0444\u0430\u0433\u043e\u0432?","\u0433\u043e\u043b\u043e\u0432\u043a\u0430 \u0438 \u0445\u0432\u043e\u0441\u0442\u043e\u0432\u043e\u0439 \u043e\u0442\u0440\u043e\u0441\u0442\u043e\u043a","\u043c\u0435\u0442\u043e\u0434\u043e\u043c \u0441\u0443\u0445\u043e\u0433\u043e \u0436\u0430\u0440\u0430","\u0444\u043e\u0440\u043c\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0438\u043c\u043c\u0443\u043d\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u043f\u0430\u043c\u044f\u0442\u0438, \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u0435 \u0432\u0442\u043e\u0440\u0438\u0447\u043d\u043e\u0433\u043e \u0438\u043c\u043c\u0443\u043d\u043d\u043e\u0433\u043e \u043e\u0442\u0432\u0435\u0442\u0430","\u0438\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439, \u0434\u043b\u044f \u043b\u0435\u0447\u0435\u043d\u0438\u044f \u0438 \u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0430\u043b\u044c\u043d\u044b\u0445 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u043d\u0438\u0439"],["\u041d\u0430\u0437\u043e\u0432\u0438\u0442\u0435, \u0441 \u043a\u0430\u043a\u043e\u0439 \u0446\u0435\u043b\u044c\u044e \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u044e\u0442\u0441\u044f \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u0444\u0430\u0433\u0438?","\u0438\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439, \u0434\u043b\u044f \u043b\u0435\u0447\u0435\u043d\u0438\u044f \u0438 \u043f\u0440\u043e\u0444\u0438\u043b\u0430\u043a\u0442\u0438\u043a\u0438 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0430\u043b\u044c\u043d\u044b\u0445 \u0437\u0430\u0431\u043e\u043b\u0435\u0432\u0430\u043d\u0438\u0439","\u041c\u0438\u043a\u043e\u043b\u043e\u0432\u044b\u0435 \u043a\u0438\u0441\u043b\u043e\u0442\u044b \u0438 \u043b\u0438\u043f\u0438\u0434\u044b","\u043e\u0431\u043b\u0438\u0433\u0430\u0442\u043d\u044b\u0435 (\u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0435) \u0432\u043d\u0443\u0442\u0440\u0438\u043a\u043b\u0435\u0442\u043e\u0447\u043d\u044b\u0435 \u043f\u0430 \u0440\u0430\u0437\u0438\u0442\u044b","\u0434\u043b\u044f \u0447\u0438\u0441\u0442\u044b\u0445 \u043a\u0443\u043b\u044c\u0442\u0443\u0440 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0439"],["\u0423\u043a\u0430\u0436\u0438\u0442\u0435, \u043a\u0430\u043a\u043e\u0439 \u0442\u0438\u043f \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u044b \u043a\u0430\u043f\u0441\u0438\u0434\u0430, \u043f\u043e \u043a\u043e\u0442\u043e\u0440\u044b\u043c \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u043e\u0432\u0430\u043d\u044b \u0432\u0438\u0440\u0443\u0441\u043d\u044b\u0435 \u0447\u0430\u0441\u0442\u0438\u0446\u044b?","\u0441\u043f\u0438\u0440\u0430\u043b\u044c\u043d\u043e\u043c\u0443, \u0438\u043a\u043e\u0441\u0430\u044d\u0434\u0440\u0438\u0447\u0435\u0441\u043a\u043e\u043c\u0443 \u0438 \u0441\u043b\u043e\u0436\u043d\u043e\u043c\u0443","\u0440\u0435\u0430\u043a\u
